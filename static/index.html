<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auftragspipeline — Projektbesprechung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2F3EF; --panel:#FFFFFF; --ink:#1B2430;
    --steel:#2C4A63; --steel-deep:#1E3547; --steel-soft:#E4EAEE;
    --slate:#6C7A85; --slate-light:#A9B2B9; --line:#DCDFDA;
    --copper:#9C5A34; --copper-soft:#EFE2D6;
    --red:#B0432E; --red-soft:#F6E1DC;
    --amber:#C4872A; --amber-soft:#F6EAD5;
    --green:#4B7A56; --green-soft:#DFEBE2;
    --versand:#0077DB; --versand-soft:#DCEAF6;
    --lieferant:#7E62A1; --lieferant-soft:#EBE4F6;
    --radius:3px; --shadow:0 1px 2px rgba(27,36,48,0.06), 0 4px 14px rgba(27,36,48,0.05);
    font-size:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--paper); color:var(--ink); font-family:'IBM Plex Sans', sans-serif; -webkit-font-smoothing:antialiased; }
  .mono{font-family:'IBM Plex Mono', monospace; letter-spacing:0.01em;}
  .display{font-family:'Archivo', sans-serif; font-weight:700;}
  a{color:inherit;} button{font-family:inherit;}

  .app{ display:grid; grid-template-columns:clamp(300px, 20vw, 400px) 1fr; grid-template-rows:auto auto 1fr; height:100vh; }
  @media (max-width: 880px){ .app{grid-template-columns:1fr;} .sidebar{border-right:none; border-bottom:1px solid var(--line);} }

  .topbar{ grid-column:1 / -1; display:flex; align-items:center; gap:14px; padding:14px 24px; background:var(--steel-deep); color:#EDEFEA; flex-wrap:wrap; }
  .topbar .mark{ width:30px; height:30px; display:flex; align-items:center; justify-content:center; }
  .topbar h1{ font-size:1.05rem; margin:0; letter-spacing:0.01em; }
  .topbar .sub{ font-size:0.78rem; color:#A9BAC4; margin-left:2px; }
  .topbar .stat{ margin-left:auto; font-family:'IBM Plex Mono', monospace; font-size:0.78rem; color:#C7D3D8; display:flex; gap:18px; }
  .topbar .stat b{color:#EDEFEA; font-weight:600;}
  .topbar .sync-btn{ background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.22); color:#EDEFEA; font-size:0.76rem; font-weight:600; font-family:inherit; padding:6px 12px; border-radius:20px; cursor:pointer; white-space:nowrap; }
  .topbar .sync-btn:hover{background:rgba(255,255,255,0.16);}
  .topbar .sync-btn:disabled{opacity:0.55; cursor:default;}

  .tabbar{ grid-column:1 / -1; display:flex; gap:2px; background:var(--steel); padding:0 24px; overflow-x:auto; min-width:0; }
  .tab-btn{ flex-shrink:0; }
  .tab-btn{ background:none; border:none; color:#CFE0E7; padding:10px 18px; font-size:0.85rem; font-weight:600; cursor:pointer; border-bottom:2px solid transparent; }
  .tab-btn:hover{color:#fff;}
  .tab-btn:focus-visible{outline:2px solid #fff; outline-offset:-2px;}
  .tab-btn.active{ color:#fff; border-bottom-color:var(--copper); }

  .sidebar{ border-right:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; min-height:0; overflow:hidden; }
  .sidebar-controls{ padding:16px 16px 12px; border-bottom:1px solid var(--line); }
  .search{ width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:var(--radius); font-size:0.88rem; font-family:inherit; background:var(--paper); color:var(--ink); }
  .search:focus-visible{outline:2px solid var(--steel); outline-offset:1px;}

  .prio-filters{ display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  .chip{ border:1px solid var(--line); background:var(--panel); padding:5px 10px; border-radius:20px; font-size:0.74rem; cursor:pointer; display:flex; align-items:center; gap:6px; color:var(--slate); }
  .chip:hover{border-color:var(--slate-light);}
  .chip:focus-visible{outline:2px solid var(--steel); outline-offset:1px;}
  .chip.active{border-color:var(--ink); color:var(--ink); font-weight:600;}
  .dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .dot.rot{background:var(--red);} .dot.gelb{background:var(--amber);} .dot.gruen{background:var(--green);}
  .dot.in_bearbeitung{background:var(--steel);} .dot.versendet{background:var(--amber);}
  .dot.wiedervorlage{background:var(--copper);} .dot.gewonnen{background:var(--green);} .dot.verloren{background:var(--red);}
  .dot.neu{background:var(--copper);} .dot.in_fertigung{background:var(--amber);}
  .dot.versandbereit{background:var(--versand);} .dot.erledigt{background:var(--green);}
  .dot.in_pruefung{background:var(--amber);} .dot.angenommen{background:var(--green);} .dot.abgelehnt{background:var(--red);}

  .order-list{ overflow-y:auto; flex:1; padding:8px; }
  .order-card{ width:100%; text-align:left; background:var(--panel); border:1px solid var(--line); border-left:3px solid transparent; border-radius:var(--radius); padding:12px 13px; margin-bottom:7px; cursor:pointer; display:block; }
  .order-card:hover{border-color:var(--slate-light);}
  .order-card:focus-visible{outline:2px solid var(--steel); outline-offset:1px;}
  .order-card.selected{ background:#F7F8F6; box-shadow:var(--shadow); }
  .order-card.rot{border-left-color:var(--red);} .order-card.gelb{border-left-color:var(--amber);} .order-card.gruen{border-left-color:var(--green);}
  .order-card.in_bearbeitung{border-left-color:var(--steel);} .order-card.versendet{border-left-color:var(--amber);}
  .order-card.wiedervorlage{border-left-color:var(--copper);} .order-card.gewonnen{border-left-color:var(--green);} .order-card.verloren{border-left-color:var(--red);}
  .order-card.neu{border-left-color:var(--copper);} .order-card.in_pruefung{border-left-color:var(--amber);}
  .order-card.angenommen{border-left-color:var(--green);} .order-card.abgelehnt{border-left-color:var(--red);}
  .order-card .komm{font-size:0.78rem; color:var(--slate); margin-bottom:3px;}
  .order-card .kunde{font-weight:600; font-size:0.92rem; margin-bottom:5px;}
  .order-card .meta{ display:flex; justify-content:space-between; align-items:center; font-size:0.72rem; color:var(--slate); gap:6px; }
  .status-badge{ font-size:0.68rem; padding:2px 7px; border-radius:20px; font-weight:600; text-transform:uppercase; letter-spacing:0.03em; white-space:nowrap; border:none; font-family:inherit; }
  .status-badge.offen{background:var(--copper-soft); color:var(--copper);}
  .status-badge.erledigt{background:var(--green-soft); color:var(--green);}
  .status-badge.neu{background:var(--copper-soft); color:var(--copper);}
  .status-badge.in_bearbeitung{background:var(--steel-soft); color:var(--steel);}
  .status-badge.in_fertigung{background:var(--amber-soft); color:var(--amber);}
  .status-badge.versandbereit{background:var(--versand-soft); color:var(--versand);}
  .status-badge.wartet_intern{background:var(--amber-soft); color:var(--amber);}
  .status-badge.wartet_extern{background:var(--red-soft); color:var(--red);}
  .status-badge.wartet_kunde{background:var(--red-soft); color:var(--red);}
  .status-badge.wartet_lieferant{background:var(--lieferant-soft); color:var(--lieferant);}
  .status-badge.versendet{background:var(--amber-soft); color:var(--amber);}
  .status-badge.wiedervorlage{background:var(--copper-soft); color:var(--copper);}
  .status-badge.gewonnen{background:var(--green-soft); color:var(--green);}
  .status-badge.verloren{background:var(--red-soft); color:var(--red);}
  .status-badge.in_pruefung{background:var(--amber-soft); color:var(--amber);}
  .status-badge.angenommen{background:var(--green-soft); color:var(--green);}
  .status-badge.abgelehnt{background:var(--red-soft); color:var(--red);}
  .status-badge.clickable{ cursor:pointer; }
  .status-badge.clickable:hover{ filter:brightness(0.95); }
  .status-badge.clickable:focus-visible{ outline:2px solid var(--steel); outline-offset:2px; }
  .empty-list{ padding:30px 16px; color:var(--slate); font-size:0.85rem; text-align:center; }

  .main{ padding:28px clamp(24px, 3vw, 56px) 60px; max-width:min(1100px, 96%); overflow-y:auto; min-height:0; }
  @media (max-width: 880px){ .main{padding:20px; max-width:100%;} }
  .no-selection{ color:var(--slate); padding-top:80px; text-align:center; font-size:0.95rem; }

  .order-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:20px; padding-bottom:16px; margin-bottom:18px; border-bottom:1px solid var(--line); }
  .order-head .komm{ display:inline-block; font-size:0.72rem; font-family:'IBM Plex Mono', monospace; font-weight:600; letter-spacing:0.02em; color:var(--steel); background:var(--steel-soft); padding:3px 10px; border-radius:20px; margin-bottom:9px; }
  .order-head h2{ font-size:1.55rem; margin:0; display:flex; align-items:center; gap:8px; }
  .prio-tag{ display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:20px; font-size:0.76rem; font-weight:600; white-space:nowrap; margin-top:2px; border:none; font-family:inherit; }
  .prio-tag.rot{background:var(--red-soft); color:var(--red);} .prio-tag.gelb{background:var(--amber-soft); color:var(--amber);} .prio-tag.gruen{background:var(--green-soft); color:var(--green);}
  .prio-tag.in_bearbeitung{background:var(--steel-soft); color:var(--steel);} .prio-tag.versendet{background:var(--amber-soft); color:var(--amber);}
  .prio-tag.wiedervorlage{background:var(--copper-soft); color:var(--copper);} .prio-tag.gewonnen{background:var(--green-soft); color:var(--green);} .prio-tag.verloren{background:var(--red-soft); color:var(--red);}
  .prio-tag.neu{background:var(--copper-soft); color:var(--copper);} .prio-tag.in_pruefung{background:var(--amber-soft); color:var(--amber);}
  .prio-tag.angenommen{background:var(--green-soft); color:var(--green);} .prio-tag.abgelehnt{background:var(--red-soft); color:var(--red);}
  .prio-tag.clickable{ cursor:pointer; }
  .prio-tag.clickable:hover{ filter:brightness(0.95); }
  .prio-tag.clickable:focus-visible{ outline:2px solid var(--steel); outline-offset:2px; }

  .order-meta-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:16px; margin:0 0 10px; padding:18px 20px; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); }
  .order-meta-grid .field label{ display:block; font-size:0.68rem; text-transform:uppercase; letter-spacing:0.04em; color:var(--slate); margin-bottom:4px; }
  .order-meta-grid .field .val{font-size:0.9rem;} .order-meta-grid .field .val.mono{font-size:0.85rem;}

  .order-meta-secondary{ display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 26px; margin:0 2px 20px; padding-top:2px; }
  .order-meta-secondary .field{ display:flex; align-items:baseline; gap:6px; }
  .order-meta-secondary .field label{ font-size:0.64rem; text-transform:uppercase; letter-spacing:0.04em; color:var(--slate-light); }
  .order-meta-secondary .field .val{ font-size:0.8rem; color:var(--slate); }
  .order-meta-secondary .field .val.clickable-text:hover{ color:var(--steel); }
  .clickable-text{ display:inline-block; border:none; background:none; padding:0; margin:0; font:inherit; color:inherit; cursor:pointer; text-align:left; }
  .clickable-text:hover{ color:var(--steel); text-decoration:underline; }
  .clickable-text:focus-visible{ outline:2px solid var(--steel); outline-offset:2px; }

  .inline-edit{ display:inline-flex; align-items:flex-start; gap:6px; max-width:100%; }
  .inline-edit-input{ font:inherit; font-size:0.88rem; color:var(--ink); background:var(--paper); border:1px solid var(--steel); border-radius:var(--radius); padding:4px 7px; min-width:140px; max-width:100%; }
  .inline-edit-input:focus{ outline:2px solid var(--steel); outline-offset:1px; }
  textarea.inline-edit-input{ width:min(420px, 100%); resize:vertical; }
  .inline-edit-actions{ display:flex; gap:2px; flex-shrink:0; padding-top:3px; }
  .inline-edit-btn{ display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border:none; border-radius:3px; cursor:pointer; background:none; }
  .inline-edit-btn.save{ color:var(--green); } .inline-edit-btn.save:hover{ background:var(--green-soft); }
  .inline-edit-btn.cancel{ color:var(--red); } .inline-edit-btn.cancel:hover{ background:var(--red-soft); }
  .inline-edit-btn:disabled{ opacity:0.5; cursor:default; }

  .lieferumfang{ margin:16px 0 26px; }
  .lieferumfang .label{ font-size:0.68rem; text-transform:uppercase; letter-spacing:0.04em; color:var(--slate); display:inline-block; margin-bottom:4px; margin-right:4px; vertical-align:middle; }
  .lieferumfang-text{ font-size:0.92rem; color:var(--ink); line-height:1.5; white-space:pre-wrap; }

  .folder-link{ display:inline-flex; align-items:center; gap:6px; font-size:0.82rem; color:var(--steel); text-decoration:none; border-bottom:1px solid transparent; }
  .folder-link:hover{border-bottom-color:var(--steel);} .folder-link svg{flex-shrink:0;}
  .folder-field{ display:inline-flex; align-items:center; gap:8px; }
  .icon-edit-btn{ display:inline-flex; align-items:center; justify-content:center; border:none; background:none; padding:2px; margin:0; color:var(--slate-light); cursor:pointer; border-radius:3px; }
  .icon-edit-btn:hover{ color:var(--steel); background:var(--steel-soft); }
  .icon-edit-btn:focus-visible{ outline:2px solid var(--steel); outline-offset:1px; }

  .timeline-head{ display:flex; justify-content:space-between; align-items:center; margin:34px 0 4px; }
  .timeline-head h3{ font-size:0.95rem; margin:0; text-transform:uppercase; letter-spacing:0.04em; color:var(--slate); }
  .btn{ font-size:0.82rem; font-weight:600; padding:7px 14px; border-radius:var(--radius); border:1px solid var(--steel); background:var(--steel); color:#fff; cursor:pointer; }
  .btn:hover{background:var(--steel-deep); border-color:var(--steel-deep);}
  .btn:focus-visible{outline:2px solid var(--copper); outline-offset:2px;}
  .btn.ghost{ background:transparent; color:var(--steel); } .btn.ghost:hover{background:#EAEEF0;}
  .btn.small{padding:5px 10px; font-size:0.74rem;}
  .btn.text{ background:none; border:none; color:var(--steel); font-size:0.78rem; font-weight:600; padding:4px 0; cursor:pointer; }
  .btn.text:hover{text-decoration:underline;} .btn.text:focus-visible{outline:2px solid var(--steel); outline-offset:2px;}
  .btn:disabled{opacity:0.6; cursor:default;}

  .pipeline{ position:relative; margin-top:18px; padding-left:26px; }
  .pipeline::before{ content:""; position:absolute; left:6px; top:6px; bottom:6px; width:2px; background:var(--line); }
  .entry{ position:relative; padding-bottom:26px; } .entry:last-child{padding-bottom:0;}
  .entry .node{ position:absolute; left:-26px; top:2px; width:14px; height:14px; border-radius:50%; background:var(--panel); border:2px solid var(--slate-light); }
  .entry.in_bearbeitung .node{border-color:var(--steel); background:var(--steel-soft);}
  .entry.wartet_intern .node{border-color:var(--amber); background:var(--amber-soft);}
  .entry.wartet_extern .node, .entry.wartet_kunde .node{border-color:var(--red); background:var(--red-soft);}
  .entry.wartet_lieferant .node{border-color:var(--lieferant); background:var(--lieferant-soft);}
  .entry.erledigt .node{border-color:var(--green); background:var(--green-soft);}
  .entry-card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:13px 15px; }
  .entry-top{ display:flex; justify-content:space-between; gap:10px; align-items:flex-start; margin-bottom:6px; }
  .entry-meta{ font-size:0.72rem; color:var(--slate); } .entry-meta b{color:var(--ink); font-weight:600;}
  .entry-timestamps{ font-size:0.68rem; color:var(--slate-light); margin-top:2px; }
  .entry-actions{ display:flex; gap:10px; flex-shrink:0; }
  .entry-actions .btn.text{ font-size:0.72rem; }
  .entry-text{font-size:0.88rem; line-height:1.5; margin:0 0 10px; white-space:pre-wrap;}
  .entry-foot{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
  .entry-due{ font-size:0.74rem; color:var(--copper); font-family:'IBM Plex Mono', monospace; } .entry-due.none{color:var(--slate-light);}
  .entry-due.warn{ color:var(--red); font-weight:600; }
  .task-badge{ font-size:0.7rem; background:var(--copper-soft); color:var(--copper); padding:3px 9px; border-radius:20px; font-weight:600; }

  .new-entry-form{ background:var(--panel); border:1px dashed var(--slate-light); border-radius:var(--radius); padding:14px 15px; margin-top:14px; }
  .new-entry-form textarea, .new-entry-form select, .new-entry-form input{ width:100%; font-family:inherit; font-size:0.85rem; padding:8px 10px; border:1px solid var(--line); border-radius:var(--radius); background:var(--paper); color:var(--ink); margin-top:4px; }
  .new-entry-form textarea:focus-visible, .new-entry-form select:focus-visible, .new-entry-form input:focus-visible{ outline:2px solid var(--steel); outline-offset:1px; }
  .form-row{margin-bottom:10px;}
  .form-row label{font-size:0.72rem; color:var(--slate); text-transform:uppercase; letter-spacing:0.03em;}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .form-actions{display:flex; gap:8px; margin-top:4px; justify-content:flex-end;}

  .modal-backdrop{ position:fixed; inset:0; background:rgba(27,36,48,0.45); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50; }
  .modal{ background:var(--panel); border-radius:var(--radius); max-width:440px; width:100%; padding:24px; box-shadow:0 10px 40px rgba(0,0,0,0.25); }
  .modal.wide{ max-width:720px; }
  .import-list{ max-height:420px; overflow-y:auto; border:1px solid var(--line); border-radius:8px; }
  .import-row{ display:flex; gap:12px; padding:10px 12px; border-bottom:1px solid var(--line); align-items:flex-start; }
  .import-row:last-child{ border-bottom:none; }
  .import-row input[type="checkbox"]{ margin-top:3px; }
  .import-row .komm{ font-weight:600; }
  .import-row .meta{ font-size:0.8rem; color:var(--slate); }
  .import-row .lieferumfang{ font-size:0.78rem; color:var(--slate); margin-top:4px; white-space:pre-line; max-height:60px; overflow-y:auto; }
  .modal h3{margin:0 0 4px; font-size:1.05rem;} .modal .sub{font-size:0.8rem; color:var(--slate); margin-bottom:18px;}
  .modal .form-row label{display:block; margin-bottom:4px;} .modal .form-row{margin-bottom:14px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:20px;}

  .lt-inline-history{ margin:18px 0; }
  .lt-inline-history .label{ font-size:0.72rem; text-transform:uppercase; letter-spacing:0.04em; color:var(--slate); display:block; margin-bottom:8px; }
  .lt-history-list{ max-height:340px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; }
  .lt-history-row{ background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:10px 13px; }
  .lt-history-change{ font-size:0.85rem; color:var(--ink); font-family:'IBM Plex Mono', monospace; }
  .lt-history-meta{ font-size:0.7rem; color:var(--slate-light); margin-top:3px; }
  .lt-history-comment{ font-size:0.82rem; color:var(--slate); margin-top:6px; line-height:1.4; white-space:pre-wrap; }

  .position-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:16px; }
  .position-row{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; }
  .position-row-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .position-beschreibung{ font-size:0.88rem; color:var(--ink); line-height:1.4; white-space:pre-wrap; }
  .position-beschreibung b{ font-family:'IBM Plex Mono', monospace; font-weight:600; }
  .position-meta{ display:flex; align-items:center; gap:10px; margin-top:6px; flex-wrap:wrap; }
  .position-meta .lt-history-list{ margin-top:8px; width:100%; max-height:none; }
  .position-actions{ display:flex; gap:2px; flex-shrink:0; }

  .toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--steel-deep); color:#EDEFEA; padding:12px 20px; border-radius:var(--radius); font-size:0.85rem; box-shadow:var(--shadow); z-index:60; display:flex; align-items:center; gap:10px; }
  .toast.error{background:var(--red);}

  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }

  /* ===== Gantt ===== */
  .gantt-board{
    grid-column: 1 / -1;
    display:flex;
    flex-direction:column;
    overflow:auto;
    min-height:0;
    padding:20px 24px;
  }
  .waiting-board{
    grid-column: 1 / -1;
    overflow-y:auto;
    min-height:0;
    padding:28px clamp(24px, 3vw, 56px) 60px;
    max-width:min(1100px, 96%);
  }
  @media (max-width: 880px){ .waiting-board{padding:20px; max-width:100%;} }

function sortGanttItems(list){
  const order = ganttSortOrder;
  const sorted = [...list];
  if(order === "kommission_auf" || order === "kommission_ab"){
    const dir = order === "kommission_auf" ? 1 : -1;
    sorted.sort((a, b) => {
      const ra = kommissionRecency(a.kommission), rb = kommissionRecency(b.kommission);
      if(ra === null && rb === null) return 0;
      if(ra === null) return 1;
      if(rb === null) return -1;
      return dir * (ra - rb);
    });
  } else {
    const dir = order === "liefertermin_ab" ? -1 : 1;
    sorted.sort((a, b) => {
      if(!a.liefertermin && !b.liefertermin) return 0;
      if(!a.liefertermin) return 1;
      if(!b.liefertermin) return -1;
      return dir * (new Date(a.liefertermin) - new Date(b.liefertermin));
    });
  }

}

}

function getISOWeek(date){
  const d = new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate()));

  d.setUTCDate(d.getUTCDate() + 4 - dayNum);

function copyToClipboard(text){
  if(navigator.clipboard && window.isSecureContext){
    return navigator.clipboard.writeText(text);
  }
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand("copy"); } finally { document.body.removeChild(ta); }
  return Promise.resolve();
}

document.addEventListener("click", (ev) => {
  const btn = ev.target.closest(".copy-path-btn");
  if(!btn) return;
  const path = btn.dataset.path;
  copyToClipboard(path)
    .then(() => showToast("Pfad kopiert."))
    .catch(() => showToast("Pfad konnte nicht kopiert werden.", true));
});

/* ===================== API ===================== */
async function apiGet(path){
  const res = await fetch(API + path);
  if(!res.ok) throw new Error("Fehler beim Laden: " + res.status);
  return res.json();
}
async function apiDelete(path){
  const res = await fetch(API + path, { method: "DELETE" });
  if(!res.ok) throw new Error("Fehler beim Löschen: " + res.status);
}
async function apiPatch(path, body){
  const res = await fetch(API + path, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if(!res.ok) throw new Error("Fehler beim Aktualisieren: " + res.status);
  return res.json();
}
async function apiPost(path, body){
  const res = await fetch(API + path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if(!res.ok) throw new Error("Fehler beim Speichern: " + res.status);
  return res.json();
}

async function loadItems(kind){

}

// Wählt beim ersten Laden den neuesten Eintrag aus - nach Kommissions-/Angebotsnummer
// (siehe kommissionRecency), nicht nach DB-Erstelldatum, damit nachträglich importierte
// Altaufträge das nicht verfälschen. Fällt auf erstelltAm zurück, wenn keine Nummer passt.
// Erledigte Aufträge gelten als archiviert und sollen die Liste/Standardauswahl
// nicht mehr belegen — weiterhin erreichbar über den Status-Filter "Erledigt"
// oder die Suche.
function isArchived(kind, item){
  return kind === "auftrag" && item.status === "erledigt";
}

function newestItemId(kind, list){
  const cfg = KIND_CONFIG[kind];
  const pool = list.filter(item => !isArchived(kind, item));
  const candidates = pool.length ? pool : list;
  const byErstelltAm = () => candidates.reduce((best, item) =>
    (!best || new Date(item.erstelltAm) > new Date(best.erstelltAm)) ? item : best
  ).id;
  if(cfg.useKommissionRecency === false){
    return byErstelltAm();
  }
  let best = null, bestRec = -Infinity;
  for(const item of candidates){
    const rec = kommissionRecency(item.kommission);
    if(rec !== null && rec > bestRec){ bestRec = rec; best = item; }
  }
  return best ? best.id : byErstelltAm();
}

// Kommission/Angebotsnummer folgt dem Schema "…-<Nummer>/<Jahr>" (z.B. K-04858/26).
// Die Nummer steigt fortlaufend mit dem tatsächlichen Anlagedatum des Auftrags -
// je höher die Nummer (innerhalb desselben Jahres), desto neuer der Auftrag.
// Das ist verlässlicher als das DB-Erstelldatum, das bei nachträglich
// importierten Altaufträgen nicht die echte Reihenfolge widerspiegelt.
function kommissionRecency(komm){
  const m = /(\d+)\s*\/\s*(\d{2,4})\s*$/.exec(komm || "");
  if(!m) return null;
  const number = parseInt(m[1], 10);
  let year = parseInt(m[2], 10);
  if(year < 100) year += 2000;
  return year * 100000 + number;
}

function sortItems(list){
  const cfg = KIND_CONFIG[currentTab];
  const order = sortOrder[currentTab];
  const dateField = cfg.dateField;
  const sorted = [...list];
  if(order === "erstellt_neu" || order === "erstellt_alt"){
    const dir = order === "erstellt_neu" ? -1 : 1;
    if(cfg.useKommissionRecency === false){
      sorted.sort((a, b) => dir * (new Date(a.erstelltAm) - new Date(b.erstelltAm)));
    } else {
      sorted.sort((a, b) => {
        const ra = kommissionRecency(a.kommission), rb = kommissionRecency(b.kommission);
        if(ra === null && rb === null) return 0;
        if(ra === null) return 1;
        if(rb === null) return -1;
        return dir * (ra - rb);
      });
    }
  } else if(order === `${dateField}_auf` || order === `${dateField}_ab`){
    const dir = order.endsWith("_auf") ? 1 : -1;
    sorted.sort((a, b) => {
      const av = a[dateField], bv = b[dateField];
      if(!av && !bv) return 0;
      if(!av) return 1;
      if(!bv) return -1;
      return dir * (new Date(av) - new Date(bv));
    });
  } else if(order === "prio" && cfg.prioOrder){
    sorted.sort((a, b) => cfg.prioOrder.indexOf(a.prio) - cfg.prioOrder.indexOf(b.prio));
  } else if(order === "status" && cfg.statusOrder){
    sorted.sort((a, b) => cfg.statusOrder.indexOf(a.status) - cfg.statusOrder.indexOf(b.status));
  }
  return sorted;
}

function _activateTabNow(tab){
  currentTab = tab;
  document.querySelectorAll(".tab-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.tab === tab);
    b.setAttribute("aria-selected", b.dataset.tab === tab ? "true" : "false");
  });

  const isGantt = tab === "gantt";
  const isWartend = tab === "wartend";
  const isProzesse = tab === "prozesse";
  const isBoardTab = isGantt || isWartend || isProzesse;
  document.getElementById("sidebarPane").style.display = isBoardTab ? "none" : "flex";
  document.getElementById("main").style.display = isBoardTab ? "none" : "block";
  document.getElementById("ganttBoard").style.display = isGantt ? "flex" : "none";
  document.getElementById("waitingBoard").style.display = isWartend ? "block" : "none";
  document.getElementById("prozessBoard").style.display = isProzesse ? "grid" : "none";

  if(isProzesse){
    openProzesseTab();
    return;
  }
  if(isGantt){
    renderGanttBoard();
    updateStatsForGantt();
    return;
  }
  if(isWartend){
    renderWaitingBoard();
    updateStatsForWaiting();
    return;
  }

  document.getElementById("searchInput").value = searchTerm[tab];
  renderFilterChips();
  renderSortSelect();
  renderNewItemButton();
  renderList();
  renderMain();
  updateStats();
}

function collectWaitingRows(){
  const rows = [];
  ["anfrage", "auftrag", "angebot"].forEach(type => {
    itemsCache[type].forEach(item => {
      item.verlauf.forEach(e => {
        rows.push({ item, e, type });
      });
    });
  });
  rows.sort((a, b) => {
    if(!a.e.faelligkeit && !b.e.faelligkeit) return 0;
    if(!a.e.faelligkeit) return 1;
    if(!b.e.faelligkeit) return -1;
    return new Date(a.e.faelligkeit) - new Date(b.e.faelligkeit);
  });
  return rows;
}

function updateStatsForWaiting(){
  const count = collectWaitingRows().length;
  document.getElementById("statBar").innerHTML = `<span><b>${count}</b> Aufgaben</span>`;
}

function renderWaitingBoard(){
  const board = document.getElementById("waitingBoard");
  const allRows = collectWaitingRows();

  if(allRows.length === 0){
    board.innerHTML = `<div class="no-selection">Keine Aufgaben vorhanden.</div>`;
    return;
  }

  const personen = [...new Set(allRows.map(r => r.e.verantwortlich).filter(Boolean))].sort((a, b) => a.localeCompare(b));
  if(wartendVerantwortlichFilter !== "alle" && wartendVerantwortlichFilter !== "ohne" && !personen.includes(wartendVerantwortlichFilter)){
    wartendVerantwortlichFilter = "alle";
  }
  const vorhandeneStatus = ALLE_TASK_STATUSES.filter(s => allRows.some(r => r.e.status === s));
  const rows = allRows.filter(r => {
    const matchesPerson = wartendVerantwortlichFilter === "alle" ? true
      : wartendVerantwortlichFilter === "ohne" ? !r.e.verantwortlich
      : r.e.verantwortlich === wartendVerantwortlichFilter;
    const matchesStatus = wartendStatusFilter === "alle" || r.e.status === wartendStatusFilter;
    return matchesPerson && matchesStatus;
  });

  const toolbarHtml = `
    <div class="waiting-toolbar">
      <label for="wartendStatusSelect">Status</label>
      <select id="wartendStatusSelect">
        <option value="alle" ${wartendStatusFilter === "alle" ? "selected" : ""}>Alle</option>
        ${vorhandeneStatus.map(s => `<option value="${s}" ${wartendStatusFilter === s ? "selected" : ""}>${taskStatusLabel(s)}</option>`).join("")}
      </select>
      <label for="wartendVerantwortlichSelect">Verantwortlich</label>
      <select id="wartendVerantwortlichSelect">
        <option value="alle" ${wartendVerantwortlichFilter === "alle" ? "selected" : ""}>Alle</option>
        ${personen.map(p => `<option value="${p.replace(/"/g, "&quot;")}" ${wartendVerantwortlichFilter === p ? "selected" : ""}>${p}</option>`).join("")}
        <option value="ohne" ${wartendVerantwortlichFilter === "ohne" ? "selected" : ""}>Ohne Zuweisung</option>
      </select>
    </div>
  `;

  const rowsHtml = rows.length
    ? rows.map(({item, e, type}) => {
        const ueberfaellig = item.liefertermin && e.faelligkeit && e.faelligkeit > item.liefertermin;
        return `
          <button class="waiting-row" data-item-id="${item.id}" data-type="${type}">
            <div class="waiting-main">
              <div class="waiting-komm">${item.kommission ? item.kommission + ' — ' : ''}${item.kunde}</div>
              <div class="waiting-text">${e.text}</div>
              <div class="waiting-meta">
                ${e.verantwortlich ? `<span>Verantwortlich: ${e.verantwortlich}</span>` : ''}
                <span class="${ueberfaellig ? 'warn' : ''}">${e.faelligkeit ? 'Fällig ' + fmtDate(e.faelligkeit) : 'Keine Fälligkeit'}${ueberfaellig ? ' · nach Liefertermin!' : ''}</span>
              </div>
            </div>
            <span class="status-badge ${e.status}">${taskStatusLabel(e.status)}</span>
          </button>
        `;
      }).join("")
    : `<div class="no-selection" style="padding-top:30px;">Keine Aufgaben für diese Auswahl.</div>`;

  board.innerHTML = toolbarHtml + rowsHtml;

  document.getElementById("wartendStatusSelect").addEventListener("change", (ev) => {
    wartendStatusFilter = ev.target.value;
    renderWaitingBoard();
  });
  document.getElementById("wartendVerantwortlichSelect").addEventListener("change", (ev) => {
    wartendVerantwortlichFilter = ev.target.value;
    renderWaitingBoard();
  });

  board.querySelectorAll(".waiting-row").forEach(row => {
    row.addEventListener("click", () => {
      const type = row.dataset.type;
      selectedId[type] = parseInt(row.dataset.itemId, 10);
      activateTab(type);
    });
  });
}

function renderGanttBoard(){
  const board = document.getElementById("ganttBoard");
  const DAY_W = 26;
  const ROW_LABEL_W = 220;
  const WEEKS_PAST = 12; // wie weit rückwärts gerendert wird (per Scroll erreichbar)
  const WEEKS_PAST_VISIBLE = 1; // wie viel Vergangenheit standardmäßig sichtbar ist
  const WEEKS_FUTURE = 10;

  const today = new Date();
  const todayUTC = new Date(Date.UTC(today.getFullYear(), today.getMonth(), today.getDate()));

  const offene = sortGanttItems(itemsCache.auftrag.filter(a => a.status !== "erledigt"));

  const rangeStart = mondayOfWeekContaining(todayUTC);
  rangeStart.setUTCDate(rangeStart.getUTCDate() - WEEKS_PAST * 7);
  const rangeEnd = new Date(rangeStart);
  rangeEnd.setUTCDate(rangeEnd.getUTCDate() + (WEEKS_PAST + WEEKS_FUTURE) * 7);
  const totalDays = daysBetween(rangeStart, rangeEnd);
  const totalWidth = totalDays * DAY_W;

  const weekCount = Math.ceil(totalDays / 7);
  let weekHeaderHtml = "";
  for(let i = 0; i < weekCount; i++){
    const wStart = new Date(rangeStart); wStart.setUTCDate(wStart.getUTCDate() + i * 7);
    const label = `KW ${getISOWeek(wStart)}`;
    weekHeaderHtml += `<div class="gantt-week" style="width:${7*DAY_W}px;">${label}</div>`;
  }

  let dayHeaderHtml = "";
  for(let i = 0; i < totalDays; i++){
    const d = new Date(rangeStart); d.setUTCDate(d.getUTCDate() + i);
    dayHeaderHtml += `<div class="gantt-day" style="width:${DAY_W}px;">${d.getUTCDate()}</div>`;
  }

  const todayOffset = daysBetween(rangeStart, todayUTC) * DAY_W;

  const rowsHtml = offene.map(item => {
    const start = item.erstelltAm ? toUTCDateOnly(item.erstelltAm.slice(0, 10)) : rangeStart;
    const end = item.liefertermin ? toUTCDateOnly(item.liefertermin) : null;
    const clampedStart = start < rangeStart ? rangeStart : start;
    let barLeft = daysBetween(rangeStart, clampedStart) * DAY_W;
    let barWidth;
    if(end){
      const clampedEnd = end > rangeEnd ? rangeEnd : end;
      barWidth = Math.max(daysBetween(clampedStart, clampedEnd) * DAY_W, 18);
    } else {
      barWidth = DAY_W; // kein Termin: schmaler Marker
    }
    let deliveryMarkHtml = "";
    if(end){
      const deliveryOffset = daysBetween(rangeStart, end) * DAY_W;
      deliveryMarkHtml = `<div class="gantt-delivery-mark" style="left:${deliveryOffset}px;" title="Liefertermin: ${fmtDate(item.liefertermin)}"></div>`;
    }
    return `
      <div class="gantt-row">
        <div class="gantt-row-label" style="width:${ROW_LABEL_W}px;">
          <span class="komm">${item.kommission}</span>${item.kunde}
        </div>
        <div class="gantt-track" style="width:${totalWidth}px;">
          <div class="gantt-bar ${item.prio}" data-id="${item.id}" style="left:${barLeft}px; width:${barWidth}px;" title="${item.kommission} — ${item.kunde}">
            ${item.liefertermin ? fmtDate(item.liefertermin) : 'kein Termin'}
          </div>
          ${deliveryMarkHtml}
        </div>
      </div>
    `;
  }).join("");

  board.innerHTML = `
    <div class="gantt-toolbar">
      <label for="ganttSortSelect">Sortierung</label>
      <select id="ganttSortSelect">
        ${GANTT_SORT_OPTIONS.map(o => `<option value="${o.value}" ${ganttSortOrder === o.value ? 'selected' : ''}>${o.label}</option>`).join("")}
      </select>
    </div>
    <div class="gantt-inner">
      <div class="gantt-header-group">
        <div class="gantt-header">
          <div class="row-label-spacer" style="width:${ROW_LABEL_W}px;"></div>
          ${weekHeaderHtml}
        </div>
        <div class="gantt-day-header">
          <div class="row-label-spacer" style="width:${ROW_LABEL_W}px;"></div>
          ${dayHeaderHtml}
        </div>
      </div>
      <div style="position:relative;">
        <div class="gantt-today-line" style="left:${ROW_LABEL_W + todayOffset}px;" title="Heute: ${fmtDate(isoDateStr(todayUTC))}"></div>
        ${rowsHtml || '<div class="no-selection" style="padding-top:20px;">Keine offenen Aufträge.</div>'}
      </div>
    </div>
  `;

  board.querySelectorAll(".gantt-bar").forEach(bar => {
    bar.addEventListener("click", () => {
      const item = itemsCache.auftrag.find(a => a.id === parseInt(bar.dataset.id, 10));
      if(item) openLiefertermineDialog(item);
    });
  });

  document.getElementById("ganttSortSelect").addEventListener("change", (ev) => {
    ganttSortOrder = ev.target.value;
    renderGanttBoard();
  });

  // Standardmäßig nur 1 Woche Vergangenheit sichtbar, Rest per Scroll erreichbar.
  // (ROW_LABEL_W nicht addieren: die sticky Beschriftung deckt bereits die ersten
  // ROW_LABEL_W Pixel ab jeder scrollLeft-Position ab.)
  board.scrollLeft = Math.max(0, todayOffset - WEEKS_PAST_VISIBLE * 7 * DAY_W);
}

async function splitLieferumfangInPositionen(item){
  const lines = (item.lieferumfang || "").split("\n").map(l => l.trim()).filter(Boolean);
  if(!lines.length) return;
  const btn = document.getElementById("splitLieferumfangBtn");
  if(btn) btn.disabled = true;
  try{
    for(const line of lines){
      const match = /^([^\s:]+):\s*(.+)$/.exec(line);
      await apiPost(`/items/${item.id}/positionen`, {
        position: match ? match[1] : null,
        beschreibung: match ? match[2] : line,
        liefertermin: null,
      });
    }
    await loadItems(currentTab);
    renderMain();
    showToast("Lieferumfang in Positionen aufgeteilt — jetzt je Punkt mit eigenem Liefertermin versehbar.");
  }catch(err){
    showToast("Aufteilen fehlgeschlagen.", true);
    if(btn) btn.disabled = false;
  }
}

/* ===================== List rendering ===================== */
function renderList(){
  const cfg = KIND_CONFIG[currentTab];
  const list = document.getElementById("orderList");
  const filterVal = activeFilter[currentTab];
  const statusFilterVal = activeStatusFilter[currentTab] || "alle";
  const term = searchTerm[currentTab].trim().toLowerCase();

  const baseMatches = item => {
    const matchesFilter = filterVal === "alle" || item[cfg.statusField] === filterVal;
    const matchesStatusFilter = !cfg.statusFilterChips || statusFilterVal === "alle" || item.status === statusFilterVal;
    const matchesSearch = !term || item.kommission.toLowerCase().includes(term) || item.kunde.toLowerCase().includes(term);
    return matchesFilter && matchesStatusFilter && matchesSearch;
  };
  // Archivierte (erledigte) Aufträge nur zeigen, wenn gezielt per Status-Filter
  // "Erledigt" oder per Suche danach gesucht wird — nicht in der Standardansicht.
  const matchesArchiv = item => !!term || statusFilterVal !== "alle" || !isArchived(currentTab, item);

  let filtered = itemsCache[currentTab].filter(item => baseMatches(item) && matchesArchiv(item));
  filtered = sortItems(filtered);

  if(filtered.length === 0){
    const nurArchiviert = itemsCache[currentTab].some(item => baseMatches(item) && !matchesArchiv(item));
    list.innerHTML = nurArchiviert
      ? `<div class="empty-list">Nur archivierte (erledigte) Aufträge gefunden. Mit dem Status-Filter „Erledigt" oben wieder ansehen.</div>`
      : `<div class="empty-list">Keine Einträge gefunden.</div>`;
    return;
  }

  list.innerHTML = filtered.map(item => `
    <button class="order-card ${cfg.cardClass(item)} ${item.id === selectedId[currentTab] ? 'selected' : ''}" data-id="${item.id}">
      ${item.kommission ? `<div class="komm mono">${item.kommission}</div>` : ""}
      <div class="kunde">${item.kunde}</div>
      <div class="meta">
        <span>${cfg.cardMetaLeft(item)}</span>
        ${cfg.cardStatusBadge(item)}
      </div>
    </button>
  `).join("");

  list.querySelectorAll(".order-card").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = parseInt(btn.dataset.id, 10);
      if(id === selectedId[currentTab]) return;
      guardUnsavedInlineEdit(() => {
        selectedId[currentTab] = id;
        renderList();
        renderMain();
      });
    });
  });
}

let activeInlineEdit = null; // { cancel(), save() } — höchstens eine Inline-Bearbeitung gleichzeitig aktiv

function startInlineFieldEdit(item, opts, triggerEl, explicitValueEl){
  // opts: { field, label, inputType ('text'|'date'|'select'|'textarea'), placeholder, options, rows, emptyLabel }
  // options: Array<string> oder Array<{value, label}>
  if(activeInlineEdit) activeInlineEdit.cancel();

  const container = explicitValueEl || triggerEl.closest(".val") || triggerEl.closest("h2") || triggerEl.parentElement;
  const currentValue = item[opts.field] || "";
  const originalDisplay = container.style.display;
  const originalTriggerDisplay = triggerEl.style.display;

  const wrap = document.createElement("span");
  wrap.className = "inline-edit";

  let inputEl;
  if(opts.inputType === "select"){
    inputEl = document.createElement("select");
    inputEl.innerHTML = `<option value="">${opts.emptyLabel || "— niemand —"}</option>` +
      opts.options.map(o => {
        const value = typeof o === "string" ? o : o.value;
        const label = typeof o === "string" ? o : o.label;
        return `<option value="${value.replace(/"/g, "&quot;")}" ${currentValue === value ? "selected" : ""}>${label}</option>`;
      }).join("");
  } else if(opts.inputType === "textarea"){
    inputEl = document.createElement("textarea");
    inputEl.rows = opts.rows || 4;
    inputEl.value = currentValue;
    if(opts.placeholder) inputEl.placeholder = opts.placeholder;
  } else {
    inputEl = document.createElement("input");
    inputEl.type = opts.inputType;
    inputEl.value = currentValue;
    if(opts.placeholder) inputEl.placeholder = opts.placeholder;
  }
  inputEl.className = "inline-edit-input";
  wrap.appendChild(inputEl);

  const actions = document.createElement("span");
  actions.className = "inline-edit-actions";
  const saveBtn = document.createElement("button");
  saveBtn.className = "inline-edit-btn save";
  saveBtn.type = "button";
  saveBtn.title = "Speichern";
  saveBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M4 12.5 9 18 20 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const cancelBtn = document.createElement("button");
  cancelBtn.className = "inline-edit-btn cancel";
  cancelBtn.type = "button";
  cancelBtn.title = "Abbrechen";
  cancelBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M5 5l14 14M19 5 5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
  actions.appendChild(saveBtn);
  actions.appendChild(cancelBtn);
  wrap.appendChild(actions);

  container.style.display = "none";
  triggerEl.style.display = "none";
  container.insertAdjacentElement("afterend", wrap);
  inputEl.focus();
  if(inputEl.select) inputEl.select();

  function restore(){
    wrap.remove();
    container.style.display = originalDisplay;
    triggerEl.style.display = originalTriggerDisplay;
    activeInlineEdit = null;
  }

  async function doSave(){
    const value = opts.inputType === "select" ? (inputEl.value || null) : (inputEl.value.trim() || null);
    saveBtn.disabled = true; cancelBtn.disabled = true; inputEl.disabled = true;
    try{
      await apiPatch(`/items/${item.id}`, { [opts.field]: value });
      activeInlineEdit = null;
      await loadItems(currentTab);
      renderList();
      renderMain();
      updateStats();
      showToast(`${opts.label} aktualisiert.`);
    }catch(err){
      showToast(`${opts.label} konnte nicht aktualisiert werden.`, true);
      saveBtn.disabled = false; cancelBtn.disabled = false; inputEl.disabled = false;
    }
  }

  function doCancel(){ restore(); }

  saveBtn.addEventListener("click", doSave);
  cancelBtn.addEventListener("click", doCancel);
  if(opts.inputType === "select"){
    inputEl.addEventListener("change", doSave);
  } else {
    inputEl.addEventListener("keydown", (ev) => {
      if(ev.key === "Escape"){ ev.preventDefault(); doCancel(); }
      else if(ev.key === "Enter" && (opts.inputType !== "textarea" || ev.ctrlKey)){ ev.preventDefault(); doSave(); }
    });
  }

  activeInlineEdit = { save: doSave, cancel: doCancel };
}

function guardUnsavedInlineEdit(proceed){
  if(!activeInlineEdit){ proceed(); return; }
  openUnsavedChangesConfirm(
    () => { activeInlineEdit.cancel(); proceed(); },
    async () => { await activeInlineEdit.save(); proceed(); }
  );
}

function renderOrderTimeline(item){
  const board = document.getElementById("orderTimelineBoard");
  if(!board) return;

  const phases = item.phasen || [];
  const events = item.verlauf.filter(e => e.faelligkeit);
  const undated = item.verlauf.filter(e => !e.faelligkeit && e.status !== "erledigt");

  const undatedHtml = undated.length ? `
    <div class="order-timeline-undated">
      <span class="order-timeline-undated-label">Ohne Fälligkeit — bitte einplanen</span>
      ${undated.map(e => `<button class="order-timeline-chip" data-entry-id="${e.id}" title="${e.text.replace(/"/g, "&quot;")}">${e.text}</button>`).join("")}
    </div>
  ` : "";

  function wireUndatedChips(){
    board.querySelectorAll(".order-timeline-chip").forEach(chip => {
      chip.addEventListener("click", () => {
        const entry = item.verlauf.find(v => v.id === parseInt(chip.dataset.entryId, 10));
        if(entry) openEditEntryModal(item, entry);
      });
    });
  }

  if(phases.length === 0 && events.length === 0){
    board.innerHTML = undatedHtml || `<div class="order-timeline-empty">Noch keine Phasen angelegt. Mit „+ Phase" den Zeitplan für diesen Auftrag aufbauen.</div>`;
    wireUndatedChips();
    return;
  }

  const DAY_W = 24;
  const LABEL_W = 170;

  const dates = [];
  if(item.erstelltAm) dates.push(toUTCDateOnly(item.erstelltAm.slice(0, 10)));
  if(item.liefertermin) dates.push(toUTCDateOnly(item.liefertermin));
  phases.forEach(p => { dates.push(toUTCDateOnly(p.start)); dates.push(toUTCDateOnly(p.ende)); });
  events.forEach(e => {
    dates.push(toUTCDateOnly((e.erstelltAm || e.faelligkeit).slice(0, 10)));
    dates.push(toUTCDateOnly(e.faelligkeit));
  });

  const today = new Date();
  const todayUTC = new Date(Date.UTC(today.getFullYear(), today.getMonth(), today.getDate()));
  dates.push(todayUTC);

  const WEEKS_PAST_VISIBLE = 1; // wie viel Vergangenheit standardmäßig sichtbar ist
  const WEEKS_PAST_SCROLLABLE = 8; // wie weit rückwärts gerendert wird (per Scroll erreichbar)
  const scrollableBoundary = mondayOfWeekContaining(todayUTC);
  scrollableBoundary.setUTCDate(scrollableBoundary.getUTCDate() - WEEKS_PAST_SCROLLABLE * 7);
  dates.push(scrollableBoundary);

  const rangeStart = mondayOfWeekContaining(new Date(Math.min(...dates)));
  let rangeEnd = mondayOfWeekContaining(new Date(Math.max(...dates)));
  rangeEnd.setUTCDate(rangeEnd.getUTCDate() + 7);

  const totalDays = Math.max(daysBetween(rangeStart, rangeEnd), 7);
  const totalWidth = totalDays * DAY_W;

  const weekCount = Math.ceil(totalDays / 7);
  let weekHeaderHtml = "";
  for(let i = 0; i < weekCount; i++){
    const wStart = new Date(rangeStart); wStart.setUTCDate(wStart.getUTCDate() + i * 7);
    const weekNum = getISOWeek(wStart);
    const label = `KW ${weekNum}`;
    weekHeaderHtml += `<div class="order-timeline-week" style="width:${7*DAY_W}px;">${label}</div>`;
  }

  let dayHeaderHtml = "";
  for(let i = 0; i < totalDays; i++){
    const d = new Date(rangeStart); d.setUTCDate(d.getUTCDate() + i);
    dayHeaderHtml += `<div class="order-timeline-day" style="width:${DAY_W}px;">${d.getUTCDate()}</div>`;
  }

  const todayOffset = daysBetween(rangeStart, todayUTC) * DAY_W;
  let deliveryLineHtml = "";
  if(item.liefertermin){
    const deliveryDate = toUTCDateOnly(item.liefertermin);
    const deliveryOffset = daysBetween(rangeStart, deliveryDate) * DAY_W;
    deliveryLineHtml = `<div class="order-timeline-delivery" style="left:${LABEL_W + deliveryOffset}px;" title="Liefertermin: ${fmtDate(item.liefertermin)}"></div>`;
  }

  const phaseRowsHtml = phases.map(p => {
    const start = toUTCDateOnly(p.start);
    const end = toUTCDateOnly(p.ende);
    const left = daysBetween(rangeStart, start) * DAY_W;
    const width = Math.max(daysBetween(start, end) * DAY_W, 18);
    const dateLabel = `${fmtDate(p.start)} – ${fmtDate(p.ende)}`;
    return `
      <div class="order-timeline-row">
        <div class="order-timeline-label" style="width:${LABEL_W}px;">${p.bezeichnung}</div>
        <div class="order-timeline-track" style="width:${totalWidth}px;">
          <div class="order-timeline-bar" data-id="${p.id}" style="left:${left}px; width:${width}px;" title="${p.bezeichnung}: ${dateLabel}"></div>
          <div class="order-timeline-bar-label" style="left:${left + width + 8}px;">${dateLabel}</div>
        </div>
      </div>
    `;
  }).join("");

  const eventRowsHtml = events.map((e, idx) => {
    const createdIso = (e.erstelltAm || e.faelligkeit).slice(0, 10);
    const dueIso = e.faelligkeit;
    const createdDate = toUTCDateOnly(createdIso);
    const dueDate = toUTCDateOnly(dueIso);
    const startDate = createdDate < dueDate ? createdDate : dueDate;
    const endDate = createdDate < dueDate ? dueDate : createdDate;
    const startIso = createdDate < dueDate ? createdIso : dueIso;
    const endIso = createdDate < dueDate ? dueIso : createdIso;
    const left = daysBetween(rangeStart, startDate) * DAY_W;
    const width = Math.max(daysBetween(startDate, endDate) * DAY_W, 18);
    const ueberfaellig = item.liefertermin && e.faelligkeit > item.liefertermin;
    const erledigt = e.status === "erledigt";
    let bg;
    if(erledigt) bg = "";
    else if(e.status === "wartet_extern" || e.status === "wartet_kunde") bg = `background:var(--red);`;
    else if(e.status === "wartet_intern") bg = `background:var(--amber);`;
    else if(e.status === "wartet_lieferant") bg = `background:var(--lieferant);`;
    else bg = `background:${TASK_COLORS[idx % TASK_COLORS.length]};`;
    const title = `${e.text} (${taskStatusLabel(e.status)}, angelegt ${fmtDate(startIso)}, fällig ${fmtDate(endIso)}${e.verantwortlich ? ', ' + e.verantwortlich : ''})${ueberfaellig ? ' — nach Liefertermin!' : ''}`.replace(/"/g, "&quot;");
    const dateLabel = `${fmtDate(startIso)} – ${fmtDate(endIso)}`;
    return `
      <div class="order-timeline-row">
        <div class="order-timeline-label" style="width:${LABEL_W}px;" title="${title}">${e.text}</div>
        <div class="order-timeline-track" style="width:${totalWidth}px;">
          <div class="order-timeline-bar verlauf ${erledigt ? 'erledigt' : ''} ${ueberfaellig ? 'ueberfaellig' : ''}" style="left:${left}px; width:${width}px; ${bg}" title="${title}"></div>
          <div class="order-timeline-bar-label" style="left:${left + width + 8}px;">${dateLabel}</div>
        </div>
      </div>
    `;
  }).join("");

  board.innerHTML = `
    ${undatedHtml}
    <div class="order-timeline-scroll">
      <div class="order-timeline-inner">
        <div class="order-timeline-header">
          <div class="order-timeline-label-spacer" style="width:${LABEL_W}px;"></div>
          ${weekHeaderHtml}
        </div>
        <div class="order-timeline-day-header">
          <div class="order-timeline-label-spacer" style="width:${LABEL_W}px;"></div>
          ${dayHeaderHtml}
        </div>
        <div style="position:relative;">
          <div class="order-timeline-today" style="left:${LABEL_W + todayOffset}px;" title="Heute: ${fmtDate(isoDateStr(todayUTC))}"></div>
          ${deliveryLineHtml}
          ${phaseRowsHtml}
          ${eventRowsHtml}
        </div>
      </div>
    </div>
  `;

  board.querySelectorAll(".order-timeline-bar[data-id]").forEach(bar => {
    bar.addEventListener("click", () => {
      const phase = phases.find(p => p.id === parseInt(bar.dataset.id, 10));
      if(phase) openPhaseModal(item, phase);
    });
  });
  wireUndatedChips();

  // Standardmäßig nur 1 Woche Vergangenheit sichtbar, Rest per Scroll erreichbar.
  // (LABEL_W nicht addieren: die sticky Beschriftung deckt bereits die ersten
  // LABEL_W Pixel ab jeder scrollLeft-Position ab.)
  const scrollEl = board.querySelector(".order-timeline-scroll");
  if(scrollEl){
    scrollEl.scrollLeft = Math.max(0, todayOffset - WEEKS_PAST_VISIBLE * 7 * DAY_W);
  }
}

function openPhaseModal(item, phase){
  const isEdit = !!phase;
  const root = document.getElementById("modalRoot");
  root.innerHTML = `
    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="phaseModalTitle">

        <div class="form-row">
          <label for="phaseBezeichnung">Bezeichnung</label>
          <input type="text" id="phaseBezeichnung" placeholder="z.B. Konstruktion" value="${isEdit ? phase.bezeichnung : ''}">
        </div>
        <div class="form-grid">
          <div class="form-row">
            <label for="phaseStart">Start</label>
            <input type="date" id="phaseStart" value="${isEdit ? phase.start : ''}">
          </div>
          <div class="form-row">
            <label for="phaseEnde">Ende</label>
            <input type="date" id="phaseEnde" value="${isEdit ? phase.ende : ''}">
          </div>
        </div>
        <div class="modal-actions" style="justify-content:${isEdit ? 'space-between' : 'flex-end'};">
          ${isEdit ? `<button class="btn text" id="phaseDelete" style="color:var(--red);">Löschen</button>` : ``}
          <div style="display:flex; gap:10px;">
            <button class="btn text" id="phaseCancel">Abbrechen</button>
            <button class="btn" id="phaseSave">${isEdit ? 'Speichern' : 'Anlegen'}</button>
          </div>
        </div>
      </div>
    </div>
  `;
  document.getElementById("phaseCancel").addEventListener("click", closeModal);
  document.getElementById("modalBackdrop").addEventListener("click", (ev) => { if(ev.target.id === "modalBackdrop") closeModal(); });
  if(isEdit){
    document.getElementById("phaseDelete").addEventListener("click", () => openDeletePhaseConfirm(item, phase));
  }
  document.getElementById("phaseSave").addEventListener("click", async () => {
    const bezeichnung = document.getElementById("phaseBezeichnung").value.trim();
    const start = document.getElementById("phaseStart").value;
    const ende = document.getElementById("phaseEnde").value;
    if(!bezeichnung || !start || !ende){
      showToast("Bezeichnung, Start und Ende sind Pflichtfelder.", true);
      return;
    }
    if(ende < start){
      showToast("Das Ende darf nicht vor dem Start liegen.", true);
      return;
    }
    const saveBtn = document.getElementById("phaseSave");
    saveBtn.disabled = true;
    try{
      if(isEdit){
        await apiPatch(`/phasen/${phase.id}`, { bezeichnung, start, ende });
      } else {
        await apiPost(`/items/${item.id}/phasen`, { bezeichnung, start, ende });
      }
      await loadItems(currentTab);
      closeModal();
      renderMain();
      showToast(isEdit ? "Phase aktualisiert." : "Phase angelegt.");
    }catch(err){
      showToast("Phase konnte nicht gespeichert werden.", true);
      saveBtn.disabled = false;
    }
  });
  document.addEventListener("keydown", escCloseOnce);
}

  document.getElementById("createCancel").addEventListener("click", closeModal);
  document.getElementById("modalBackdrop").addEventListener("click", (ev) => { if(ev.target.id === "modalBackdrop") closeModal(); });
  document.getElementById(isAnfrage ? "createKunde" : "createKommission").focus();
  document.getElementById("createConfirm").addEventListener("click", async () => {
    const kommission = isAnfrage ? "" : document.getElementById("createKommission").value.trim();
    const kunde = document.getElementById("createKunde").value.trim();
    if((!isAnfrage && !kommission) || !kunde){
      showToast(isAuftrag ? "Kommission und Kunde sind Pflichtfelder." : isAngebot ? "Angebotsnummer und Kunde sind Pflichtfelder." : "Kunde ist ein Pflichtfeld.", true);
      return;
    }
    const confirmBtn = document.getElementById("createConfirm");
    confirmBtn.disabled = true;

    const body = {
      type: kind,
      kommission,
      kunde,
      lieferumfang: document.getElementById("createLieferumfang").value.trim(),
      ordnerPfad: document.getElementById("createOrdner").value.trim() || null,
    };
    if(isAuftrag){
      body.status = document.getElementById("createStatus").value;
      body.prio = document.getElementById("createPrio").value;
      body.liefertermin = document.getElementById("createLiefertermin").value || null;
      body.lieferbedingungen = document.getElementById("createLieferbedingungen").value.trim() || null;
      body.projektleiter = document.getElementById("createProjektleiter").value || null;
    } else if(isAngebot){
      body.status = document.getElementById("createStatus").value;
      body.wert = document.getElementById("createWert").value.trim() || null;
      body.wiedervorlage = document.getElementById("createWiedervorlage").value || null;
    }

    try{
      const created = await apiPost("/items", body);
      await loadItems(kind);
      selectedId[kind] = created.id;
      closeModal();
      renderList();
      renderMain();
      updateStats();
      showToast(isAuftrag ? "Auftrag angelegt." : isAngebot ? "Angebot angelegt." : "Anfrage angelegt.");
    }catch(err){
      showToast("Konnte nicht angelegt werden.", true);
      confirmBtn.disabled = false;
    }
  });
  document.addEventListener("keydown", escCloseOnce);
}

/* ===================== Prozesse ===================== */
// Prozessaufnahme zur Vorbereitung einer möglichen ERP-Einführung.
// Grob → fein: Kategorie (F/K/U) → Hauptprozess → Teilprozess → Arbeitsschritt.
let prozesse = [];              // Übersicht aller Prozesse (flach, mit parentId)
let prozessConfig = null;       // Statuswerte vom Server
let selectedProzessId = "kette"; // "kette" = Prozesskette, null = Landkarte, "karte" = Schnittstellenkarte, sonst Prozess-ID
let pzKetteAuswahl = null;       // ausgewähltes Glied der Prozesskette
let pzSearch = "";
let verbindungen = [];          // Übergaben zwischen Prozessen (Schnittstellen)
let pzKarteFokus = null;        // in der Schnittstellenkarte hervorgehobener Prozess
let pzKarteNurProbleme = false;
let pzKarteModus = (() => { try{ return localStorage.getItem("pzKarteModus") || "grob"; }catch(e){ return "grob"; } })();
const PZ_STATUS_KURZ = {
  vorgeschlagen: "Vorgeschlagen", laut_aa: "Laut AA", aufgenommen: "Aufgenommen",
  bestaetigt: "Bestätigt", anforderungen: "Anforderungen",
};
const PZ_NACHWEIS_VORSCHLAEGE = [
  "Laut Arbeitsanweisung – Praxisabgleich offen",
  "Im Gespräch aufgenommen mit … am …",
  "An Beispielvorgang nachvollzogen (Kommission …)",
  "Von Beteiligten bestätigt",
];
const PZ_SCHRITT_FELDER = [
  { key:"taetigkeit", label:"Tätigkeit *", type:"textarea", full:true },
  { key:"ausfuehrend", label:"Ausführende Person / Rolle", list:"pzNutzerList", hint:"Person und Rolle, z.B. „Linker (Vertriebsadministration)“" },
  { key:"freigabe", label:"Freigabe / Entscheidung durch" },
  { key:"eingaben", label:"Eingaben / benötigte Informationen" },
  { key:"ergebnis", label:"Ergebnis" },
  { key:"system", label:"System / Liste / Ablage", hint:"z.B. Dashboard, Excel-Liste, K-Laufwerk, E-Mail, Papier" },
  { key:"uebergabe", label:"Übergabe an (wen, auf welchem Weg)" },
  { key:"ausnahme", label:"Ausnahme / was passiert bei fehlenden Angaben", type:"textarea", full:true },
  { key:"bearbeitungszeit", label:"Bearbeitungszeit (ca.)" },
  { key:"wartezeit", label:"Wartezeit (ca.)" },
  { key:"nachweis", label:"Quelle / Nachweis", list:"pzNachweisList", full:true, hint:"Woher stammt die Beschreibung? Arbeitsanweisung, Gespräch, Beispielvorgang, bestätigt" },
];

function pzEsc(s){
  return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function pzStatusLabel(value){
  const s = (prozessConfig?.aufnahmestatus || []).find(o => o.value === value);
  return s ? s.label : value;
}
function pzById(id){ return prozesse.find(p => p.id === id); }
function pzLabel(p){ return p.nummer ? `${p.nummer} ${p.bezeichnung}` : p.bezeichnung; }
function pzKinder(parentId){
  return prozesse.filter(p => p.parentId === parentId)
    .sort((a, b) => (a.reihenfolge - b.reihenfolge) || (a.id - b.id));
}
function pzNachkommen(id){
  const out = [];
  const stack = [id];
  while(stack.length){
    pzKinder(stack.pop()).forEach(k => { out.push(k.id); stack.push(k.id); });
  }
  return out;
}
function pzSumme(p, feld){
  return [p.id, ...pzNachkommen(p.id)].reduce((sum, id) => sum + (pzById(id)?.[feld] || 0), 0);
}
function pzAhnen(p){
  const out = [];
  let cur = p.parentId !== null ? pzById(p.parentId) : null;
  while(cur){
    out.unshift(cur);
    cur = cur.parentId !== null ? pzById(cur.parentId) : null;
  }
  return out;
}
// Alle Prozesse in Baum-Reihenfolge (wie links im Baum): jeder Prozess direkt unter seinem übergeordneten.
// Prozesse mit fehlendem übergeordnetem Prozess kommen ans Ende, damit keiner verloren geht.
function pzBaumReihenfolge(){
  const liste = [];
  const gesehen = new Set();
  const walk = (parentId) => pzKinder(parentId).forEach(p => {
    if(gesehen.has(p.id)) return;
    gesehen.add(p.id);
    liste.push(p);
    walk(p.id);
  });
  walk(null);
  prozesse.filter(p => !gesehen.has(p.id)).forEach(p => liste.push(p));
  return liste;
}

function pzNutzerDatalist(){
  return `<datalist id="pzNutzerList">${nutzer.map(n => `<option value="${pzEsc(n.name)}">`).join("")}</datalist>`;
}

async function loadProzesse(){
  if(!prozessConfig) prozessConfig = await apiGet("/prozesse/config");
  [prozesse, verbindungen] = await Promise.all([apiGet("/prozesse"), apiGet("/verbindungen")]);
}

async function openProzesseTab(){
  const board = document.getElementById("prozessBoard");
  if(!board.innerHTML){
    board.innerHTML = `
      <div class="pz-tree">
        <div class="sidebar-controls">
          <input type="text" class="search" id="pzSearchInput" placeholder="Prozess suchen…" aria-label="Prozess suchen">
          <button class="btn" id="pzNewBtn" style="width:100%; margin-top:10px;">+ Neuer Prozess</button>
        </div>
        <div class="pz-tree-list" id="pzTreeList"></div>
      </div>
      <div class="pz-main" id="pzMain"><div class="no-selection">Lädt…</div></div>`;
    document.getElementById("pzSearchInput").addEventListener("input", (ev) => {
      pzSearch = ev.target.value;
      renderPzTree();
    });
    document.getElementById("pzNewBtn").addEventListener("click", () => openPzProzessModal(null, typeof selectedProzessId === "number" ? selectedProzessId : null));
    // Alle Links auf Prozesse (Baum, Landkarte, Brotkrumen) laufen über data-pz-open
    board.addEventListener("click", (ev) => {
      const el = ev.target.closest("[data-pz-open]");
      if(!el) return;
      const v = el.dataset.pzOpen;
      pzSelect(v === "" ? null : (v === "karte" || v === "kette") ? v : parseInt(v, 10));
    });
  }
  try{
    await loadProzesse();
  }catch(err){
    document.getElementById("pzMain").innerHTML = `<div class="no-selection">Prozesse konnten nicht geladen werden. Wurde <span class="mono">seed_prozesse.py</span> ausgeführt?</div>`;
    return;
  }
  renderPzTree();
  await renderPzMain();
  updateStatsForProzesse();
}

function pzSelect(id){
  selectedProzessId = id;
  renderPzTree();
  renderPzMain();
  document.getElementById("pzMain").scrollTop = 0;
}

async function pzReload(msg){
  await loadProzesse();
  renderPzTree();
  await renderPzMain();
  updateStatsForProzesse();
  if(msg) showToast(msg);
}

function updateStatsForProzesse(){
  const eigentliche = prozesse.filter(p => p.parentId !== null);
  const schritte = prozesse.reduce((s, p) => s + p.anzahlSchritte, 0);
  const fragen = prozesse.reduce((s, p) => s + p.anzahlFragenOffen, 0);
  document.getElementById("statBar").innerHTML =
    `<span><b>${eigentliche.length}</b> Prozesse</span><span><b>${schritte}</b> Schritte</span><span><b>${verbindungen.length}</b> Schnittstellen</span><span><b>${fragen}</b> offene Fragen</span>`;
}

function renderPzTree(){
  const box = document.getElementById("pzTreeList");
  if(!box) return;
  const item = (p, ebene, zugeklappt = 0) => `
    <button class="pz-tree-item ${ebene === 0 ? 'ebene0' : ''} ${p.id === selectedProzessId ? 'selected' : ''}"
            data-pz-open="${p.id}" style="padding-left:${8 + Math.max(ebene - 1, 0) * 16}px"
            title="${pzEsc(pzLabel(p))} – ${pzEsc(pzStatusLabel(p.aufnahmestatus))}">
      ${ebene > 0 ? `<span class="dot pz-${p.aufnahmestatus}"></span><span class="nr">${pzEsc(p.nummer || '')}</span>` : ''}
      <span class="name">${pzEsc(p.bezeichnung)}</span>
      ${zugeklappt ? `<span class="cnt" style="color:var(--slate-light);" title="${zugeklappt} Teilprozesse – anklicken zum Aufklappen">▸ ${zugeklappt}</span>` : ''}
      ${p.anzahlFragenOffen ? `<span class="cnt" title="${p.anzahlFragenOffen} offene Fragen">? ${p.anzahlFragenOffen}</span>` : ''}
    </button>`;
  const rows = [`<button class="pz-tree-item ${selectedProzessId === "kette" ? 'selected' : ''}" data-pz-open="kette">
      <span class="name">Prozesskette</span></button>`,
    `<button class="pz-tree-item ${selectedProzessId === null ? 'selected' : ''}" data-pz-open="">
      <span class="name">Landkarte</span></button>`,
    `<button class="pz-tree-item ${selectedProzessId === "karte" ? 'selected' : ''}" data-pz-open="karte">
      <span class="name">Schnittstellenkarte</span><span class="cnt" style="color:var(--slate);">${verbindungen.length}</span></button>`];
  const term = pzSearch.trim().toLowerCase();
  if(term){
    const treffer = prozesse.filter(p => pzLabel(p).toLowerCase().includes(term));
    treffer.forEach(p => rows.push(item(p, 1)));
    if(!treffer.length) rows.push(`<div class="empty-list">Kein Prozess gefunden.</div>`);
  } else {
    // Teilprozesse nur aufklappen, wenn sie auf dem Weg zum gewählten Prozess liegen
    const sel = typeof selectedProzessId === "number" ? pzById(selectedProzessId) : null;
    const offen = new Set(sel ? [sel.id, ...pzAhnen(sel).map(a => a.id)] : []);
    const walk = (parentId, ebene) => pzKinder(parentId).forEach(p => {
      const kinder = pzKinder(p.id).length;
      const aufklappen = ebene === 0 || offen.has(p.id);
      rows.push(item(p, ebene, kinder && !aufklappen ? kinder : 0));
      if(aufklappen) walk(p.id, ebene + 1);
    });
    walk(null, 0);
  }
  box.innerHTML = rows.join("");
}

async function renderPzMain(){
  const main = document.getElementById("pzMain");
  if(selectedProzessId === "kette"){
    main.innerHTML = renderPzKette();
    bindPzKette();
    return;
  }
  if(selectedProzessId === "karte"){
    main.innerHTML = renderPzKarte();
    bindPzKarte();
    return;
  }
  if(selectedProzessId === null || !pzById(selectedProzessId)){
    selectedProzessId = null;
    main.innerHTML = renderPzLandkarte();
    return;
  }
  let p;
  try{
    p = await apiGet(`/prozesse/${selectedProzessId}`);
  }catch(err){
    main.innerHTML = `<div class="no-selection">Prozess konnte nicht geladen werden.</div>`;
    return;
  }
  if(p.id !== selectedProzessId) return;  // inzwischen anderer Prozess gewählt
  main.innerHTML = renderPzDetail(p);
  bindPzDetail(p);
}

    const kinder = pzKinder(p.id);

        <div class="pz-card-head">

          <span class="status-badge pz-${p.aufnahmestatus}" title="${pzEsc(pzStatusLabel(p.aufnahmestatus))}">${pzEsc(PZ_STATUS_KURZ[p.aufnahmestatus] || p.aufnahmestatus)}</span>

        </div>
        ${kinder.length ? `<ul class="pz-sub">${kinder.map(k => `
          <li><span class="dot pz-${k.aufnahmestatus}" title="${pzEsc(pzStatusLabel(k.aufnahmestatus))}"></span>
            <span class="nr">${pzEsc(k.nummer || '')}</span>
            <button class="clickable-text" data-pz-open="${k.id}">${pzEsc(k.bezeichnung)}</button></li>`).join("")}</ul>` : ''}
      </div>`;

  const exportLink = (blatt, label) => `<a class="btn ghost small" href="${API}/prozesse/export/${blatt}.csv">${label}</a>`;
  return `
    <div class="order-head"><div>
      <div class="komm">Prozessaufnahme · Vorbereitung einer möglichen Einführung eines ERP-Systems</div>

    <p class="pz-intro">Von grob nach fein: Kategorie → Hauptprozess → Teilprozess → Arbeitsschritt. Zuerst wird der
      <b>tatsächliche Ist-Ablauf</b> erfasst; Unklarheiten gehören in die offenen Fragen, Verbesserungsideen in die Notiz des Prozesses.
      Die Nummerierung folgt den QM-Arbeitsanweisungen; die Namen der Hauptprozesse sind noch mit dem QM-Handbuch abzugleichen.</p>
    <div class="pz-progress">${statusCounts}</div>

    <div class="pz-toolbar"><span class="label">Export für Excel</span>
      ${exportLink("prozessuebersicht", "Prozessübersicht")}
      ${exportLink("ablaufschritte", "Ablaufschritte")}
      ${exportLink("offene_fragen", "Offene Fragen")}
      ${exportLink("arbeitsanweisungen", "Arbeitsanweisungen")}
      ${exportLink("schnittstellen", "Schnittstellen")}
      <button class="btn small" data-pz-open="karte" style="margin-left:6px;">Schnittstellenkarte öffnen</button>
    </div>
    ${roots.length ? `<div class="pz-map">${roots.map(r => `

function renderPzDetail(p){
  const summary = pzById(p.id);
  const kinder = pzKinder(p.id);
  const crumbs = [`<button class="clickable-text" data-pz-open="">Landkarte</button>`,
    ...pzAhnen(summary).map(a => `<button class="clickable-text" data-pz-open="${a.id}">${pzEsc(pzLabel(a))}</button>`)
  ].join(`<span aria-hidden="true">›</span>`);

    `<option value="${s.value}" ${s.value === p.aufnahmestatus ? 'selected' : ''}>${pzEsc(s.label)}</option>`).join("");

  const geprueft = [p.geprueftVon, p.geprueftAm ? fmtDate(p.geprueftAm) : null].filter(Boolean).join(", ");

  const schrittZeilen = p.schritte.map((s, i) => `

        ${(s.bearbeitungszeit || s.wartezeit) ? `<div class="small">${[s.bearbeitungszeit ? 'Bearbeitung: ' + pzEsc(s.bearbeitungszeit) : '', s.wartezeit ? 'Wartezeit: ' + pzEsc(s.wartezeit) : ''].filter(Boolean).join(' · ')}</div>` : ''}
      </td>
      <td>${pzEsc(s.ausfuehrend || '—')}</td>
      <td>${pzEsc(s.eingaben || '—')}<div class="small">→ ${pzEsc(s.ergebnis || '—')}</div></td>
      <td>${pzEsc(s.system || '—')}</td>
      <td>${pzEsc(s.uebergabe || '—')}${s.freigabe ? `<div class="small">Freigabe: ${pzEsc(s.freigabe)}</div>` : ''}</td>
      <td class="quelle">${pzEsc(s.nachweis || '—')}</td>
      <td class="actions">
        <button class="pz-icon-btn" data-schritt-move="hoch" data-id="${s.id}" ${i === 0 ? 'disabled' : ''} title="Nach oben" aria-label="Schritt ${s.reihenfolge} nach oben">↑</button>
        <button class="pz-icon-btn" data-schritt-move="runter" data-id="${s.id}" ${i === p.schritte.length - 1 ? 'disabled' : ''} title="Nach unten" aria-label="Schritt ${s.reihenfolge} nach unten">↓</button>
        <button class="pz-icon-btn" data-schritt-edit="${s.id}" title="Bearbeiten" aria-label="Schritt ${s.reihenfolge} bearbeiten">✎</button>
        <button class="pz-icon-btn" data-schritt-del="${s.id}" title="Löschen" aria-label="Schritt ${s.reihenfolge} löschen">✕</button>
      </td>
    </tr>`).join("");

  const fragen = [...p.fragen].sort((a, b) => (a.status === "offen" ? 0 : 1) - (b.status === "offen" ? 0 : 1));
  const frageKarten = fragen.map(f => `
    <div class="pz-frage ${f.status}">
      <div class="entry-top">
        <p class="pz-frage-text">${pzEsc(f.frage)}</p>
        <span class="status-badge ${f.status}">${f.status === "beantwortet" ? "Beantwortet" : "Offen"}</span>
      </div>
      <div class="pz-frage-meta">
        ${f.klaerungDurch ? `<span>Klärung durch: <b>${pzEsc(f.klaerungDurch)}</b></span>` : ''}
        ${f.naechsterSchritt ? `<span>Nächster Schritt: ${pzEsc(f.naechsterSchritt)}</span>` : ''}
        ${f.faelligkeit ? `<span>Fällig ${fmtDate(f.faelligkeit)}</span>` : ''}
        ${f.erstelltVon ? `<span>Erfasst von ${pzEsc(f.erstelltVon)}</span>` : ''}
      </div>
      ${f.antwort ? `<div class="pz-frage-antwort"><span class="label">Antwort / Entscheidung</span>${pzEsc(f.antwort)}${f.nachweis ? `<div class="pz-frage-meta" style="margin-top:4px;">${pzEsc(f.nachweis)}</div>` : ''}</div>` : ''}
      <div class="entry-actions" style="margin-top:8px;">
        <button class="btn text" data-frage-edit="${f.id}">${f.status === "offen" ? "Beantworten / bearbeiten" : "Bearbeiten"}</button>
        <button class="btn text" data-frage-del="${f.id}" style="color:var(--red);">Löschen</button>
      </div>
    </div>`).join("");

  const dokZeilen = p.dokumente.map(d => `
    <tr>
      <td class="nr">${pzEsc(d.nummer)}</td>

      <td class="nr">${pzEsc(d.revision || '—')}</td>

  return `
    <div class="pz-crumbs">${crumbs}</div>

/* ---------- Schnittstellen (Übergaben zwischen Prozessen) ---------- */
const PZ_WEG_FARBEN = {
  email: "#0077DB", dashboard: "#2E8B6F", ordner: "#9C5A34", papier: "#7E62A1",
  muendlich: "#C4872A", sonstiges: "#1B2430", unklar: "#A9B2B9",
};
// Reihenfolge der Kernprozesse in der Karte (entlang eines Auftrags); andere
// Prozesse werden hinter dem nächsten übergeordneten Prozess aus dieser Liste einsortiert.
const PZ_KARTE_KERN = ["K1", "K1.05", "K3.1", "K2", "K3.3", "K3", "K3.2", "K4"];

function pzWegLabel(weg){
  const w = (prozessConfig?.wege || []).find(o => o.value === weg);
  return w ? w.label : weg;
}
function pzWegHtml(weg){
  const farbe = PZ_WEG_FARBEN[weg] || PZ_WEG_FARBEN.sonstiges;
  const linie = weg === "unklar"
    ? `background:repeating-linear-gradient(90deg, ${farbe} 0 4px, transparent 4px 7px);`
    : `background:${farbe};`;
  return `<span class="pz-weg"><span class="pz-weg-linie" style="${linie}"></span>${pzEsc(pzWegLabel(weg))}</span>`;
}

function renderPzVerbindungsListe(prozessIds, schritte){
  const ids = new Set(Array.isArray(prozessIds) ? prozessIds : [prozessIds]);
  const ein = verbindungen.filter(v => ids.has(v.nachId) && !ids.has(v.vonId));
  const aus = verbindungen.filter(v => ids.has(v.vonId) && !ids.has(v.nachId));
  const intern = ids.size > 1 ? verbindungen.filter(v => ids.has(v.vonId) && ids.has(v.nachId)) : [];
  if(!ein.length && !aus.length && !intern.length){
    return `<div class="pz-empty">Noch keine Übergaben erfasst. Über „+ Übergabe“ festhalten, was dieser Prozess von wem bekommt und an wen er etwas weitergibt.</div>`;
  }
  const link = (id) => { const a = pzById(id); return a ? `<button class="clickable-text" data-pz-open="${a.id}">${pzEsc(pzLabel(a))}</button>` : '—'; };
  const zeile = (v, andererId, pfeil) => {
    const schritt = (schritte || []).find(s => s.id === v.schrittId);
    // bei mehreren Prozessen (Hauptprozess + Teilprozesse) auch den eigenen Teilprozess nennen
    const eigener = ids.size > 1 ? (pfeil === "←" ? v.nachId : pfeil === "→" ? v.vonId : null) : null;
    return `<tr>
      <td class="nr">${pfeil}</td>
      <td>${pfeil === "↔" ? `${link(v.vonId)} → ${link(v.nachId)}` : link(andererId)}${eigener ? `<div class="small">${pfeil === "←" ? "an" : "von"} ${pzEsc(pzLabel(pzById(eigener)))}</div>` : ''}</td>
      <td>${pzEsc(v.inhalt)}${v.notiz ? `<div class="small">${pzEsc(v.notiz)}</div>` : ''}</td>
      <td>${pzWegHtml(v.weg)}</td>
      <td class="nr">${schritt ? `Schritt ${schritt.reihenfolge}` : ''}</td>
      <td>${v.problem ? '<span class="status-badge wartet_extern" title="Hier hakt es">Hakt</span>' : ''}</td>
      <td class="actions">
        <button class="pz-icon-btn" data-verb-edit="${v.id}" title="Bearbeiten" aria-label="Übergabe bearbeiten">✎</button>
        <button class="pz-icon-btn" data-verb-del="${v.id}" title="Löschen" aria-label="Übergabe löschen">✕</button>
      </td>
    </tr>`;
  };
  const gruppe = (titel, liste, pfeil, feld) => liste.length ? `
    <tr class="pz-gruppe"><td colspan="7">${titel} (${liste.length})</td></tr>
    ${liste.map(v => zeile(v, v[feld], pfeil)).join("")}` : '';
  return `<div class="pz-table-wrap"><table class="pz-table">
    <thead><tr><th></th><th>Prozess</th><th>Was wird übergeben</th><th>Weg</th><th>Schritt</th><th></th><th></th></tr></thead>
    <tbody>
      ${gruppe("Erhält von", ein, "←", "vonId")}
      ${gruppe("Übergibt an", aus, "→", "nachId")}
      ${gruppe("Innerhalb (zwischen Teilprozessen)", intern, "↔", "nachId")}
    </tbody></table></div>`;
}

          <div class="form-row" style="grid-column:1 / -1;"><label for="pzvInhalt">Was wird übergeben? *</label>
            <input id="pzvInhalt" value="${pzEsc(v?.inhalt || '')}" placeholder="z.B. Auftragsbestätigung, Stückliste, Zeichnungen, Lieferschein">
          </div>
          <div class="form-row"><label for="pzvWeg">Weg</label><select id="pzvWeg">${wegOptionen}</select></div>

        <div class="form-row"><label for="pzvNotiz">Notiz</label><textarea id="pzvNotiz" rows="2">${pzEsc(v?.notiz || '')}</textarea></div>
