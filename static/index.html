/* ---------- Prozesskette (einfache Übersicht entlang eines Auftrags) ---------- */
// Jedes Glied fasst Prozesse zusammen. Zuordnung: ein Prozess gehört zu dem Glied, dessen
// Schlüssel (Nummer oder Bezeichnung) sein nächster übergeordneter Prozess bzw. er selbst ist.
const PZ_KETTE_GLIEDER = [
  { titel: "Anfrage & Angebot", schluessel: ["K1"] },
  { titel: "Auftrag", schluessel: ["K3.1"] },
  { titel: "Konstruktion", schluessel: ["K2"] },
  { titel: "Einkauf", schluessel: ["U1"] },
  { titel: "Wareneingang & Lager", schluessel: ["U1.4", "Lager, Bestandsführung und Inventur"] },
  { titel: "Fertigung", schluessel: ["K3.3"] },
  { titel: "Prüfung & Doku", schluessel: ["Prüfung, Abnahme und Dokumentation"] },
  { titel: "Versand", schluessel: ["K3.2"] },
  { titel: "Rechnung", schluessel: ["Rechnungsstellung (inkl. Anzahlungs- und Teilrechnungen)", "Zahlungseingang und Mahnwesen"] },
  { titel: "Service", schluessel: ["Service & Ersatzteile"] },
];
const PZ_STATUS_REIHE = ["vorgeschlagen", "laut_aa", "aufgenommen", "bestaetigt", "anforderungen"];

function pzPasst(p, schluessel){
  const s = schluessel.trim().toLowerCase();
  return (p.nummer || "").toLowerCase() === s || p.bezeichnung.trim().toLowerCase() === s;
}

// Liefert je Glied die zugehörigen Prozesse und die übrigen („begleitende“) Prozesse
function pzKetteZuordnung(){
  const glieder = PZ_KETTE_GLIEDER.map(g => ({ ...g, prozesse: [] }));
  const schluesselKnoten = new Set();
  const begleitend = [];
  prozesse.forEach(p => {
    const kette = [p, ...pzAhnen(p).reverse()];  // nächster zuerst
    let treffer = null;
    for(const x of kette){
      const gi = glieder.findIndex(g => g.schluessel.some(k => pzPasst(x, k)));
      if(gi >= 0){ treffer = gi; if(x === p) schluesselKnoten.add(p.id); break; }
    }
    if(treffer !== null) glieder[treffer].prozesse.push(p);
    else if(p.parentId !== null) begleitend.push(p);
  });
  // reine Gruppierungsknoten (z.B. K3 über K3.1–K3.3) nicht als begleitend zeigen
  const hatGliedUnter = (p) => pzNachkommen(p.id).some(id => glieder.some(g => g.prozesse.some(q => q.id === id)));
  return { glieder: glieder.filter(g => g.prozesse.length), begleitend: begleitend.filter(p => !hatGliedUnter(p)) };
}

function pzGliedKennzahlen(g){
  const ids = new Set(g.prozesse.map(p => p.id));
  return {
    ids,
    schritte: g.prozesse.reduce((s, p) => s + p.anzahlSchritte, 0),
    fragen: g.prozesse.reduce((s, p) => s + p.anzahlFragenOffen, 0),
    hakt: verbindungen.filter(v => v.problem && (ids.has(v.vonId) || ids.has(v.nachId))).length,
    aufgenommen: g.prozesse.filter(p => PZ_STATUS_REIHE.indexOf(p.aufnahmestatus) >= 2).length,
  };
}

function renderPzKette(){
  const { glieder, begleitend } = pzKetteZuordnung();
  const kopf = `
    <div class="order-head"><div>
      <div class="komm">Prozessaufnahme · Vorbereitung einer möglichen Einführung eines ERP-Systems</div>
      <h2 class="display">Prozesskette</h2>
    </div></div>
    <p class="pz-intro">Der Weg eines Auftrags von der Anfrage bis zur Rechnung. Klick auf ein Glied zeigt, was dazugehört und was es von wem bekommt bzw. weitergibt.</p>`;
  if(!glieder.length){
    return kopf + `<div class="no-selection">Noch keine Prozesse der Kette vorhanden.</div>`;
  }
  const auswahl = pzKetteAuswahl !== null && glieder[pzKetteAuswahl] ? pzKetteAuswahl : null;
  const kz = glieder.map(pzGliedKennzahlen);

  const glied = (g, i) => {
    const k = kz[i];
    const statusBalken = g.prozesse.map(p =>
      `<span class="pz-kette-seg pz-${p.aufnahmestatus}" title="${pzEsc(pzLabel(p))}: ${pzEsc(pzStatusLabel(p.aufnahmestatus))}"></span>`).join("");
    return `<button class="pz-glied ${auswahl === i ? 'aktiv' : ''} ${k.hakt ? 'hakt' : ''}" data-glied="${i}">
      <span class="pz-glied-titel">${pzEsc(g.titel)}</span>
      <span class="pz-kette-balken">${statusBalken}</span>
      <span class="pz-glied-zahlen">
        <span>${k.aufgenommen}/${g.prozesse.length} aufgenommen</span>
        ${k.fragen ? `<span class="warn">? ${k.fragen}</span>` : ''}
        ${k.hakt ? `<span class="hakt">⚠ ${k.hakt}</span>` : ''}
      </span>
    </button>`;
  };
  const pfeil = (i) => {
    const a = kz[i].ids, b = kz[i + 1].ids;
    const liste = verbindungen.filter(v => a.has(v.vonId) && b.has(v.nachId));
    const hakt = liste.some(v => v.problem);
    return `<span class="pz-kette-pfeil ${hakt ? 'hakt' : ''}" title="${liste.length ? pzEsc(liste.map(v => v.inhalt).join("\n")) : 'keine Übergabe erfasst'}">
      <span>→</span>${liste.length ? `<small>${liste.length}</small>` : ''}</span>`;
  };
  const kette = glieder.map((g, i) => glied(g, i) + (i < glieder.length - 1 ? pfeil(i) : "")).join("");

  let unten;
  if(auswahl !== null){
    unten = renderPzGliedDetail(glieder[auswahl], kz[auswahl], glieder, kz);
  } else {
    const hakt = verbindungen.filter(v => v.problem);
    unten = `<div class="timeline-head"><h3>Wo es hakt (${hakt.length})</h3></div>` + (hakt.length
      ? `<div class="pz-table-wrap"><table class="pz-table"><tbody>${hakt.map(v => `
          <tr><td><button class="clickable-text" data-pz-open="${v.vonId}">${pzEsc(pzLabel(pzById(v.vonId)))}</button>
              → <button class="clickable-text" data-pz-open="${v.nachId}">${pzEsc(pzLabel(pzById(v.nachId)))}</button></td>
            <td>${pzEsc(v.inhalt)}${v.notiz ? `<div class="small">${pzEsc(v.notiz)}</div>` : ''}</td>
            <td>${pzWegHtml(v.weg)}</td></tr>`).join("")}</tbody></table></div>`
      : `<div class="pz-empty">Noch keine Übergabe als „hakt“ markiert.</div>`);
  }

  const begleitendHtml = begleitend.length ? `
    <div class="timeline-head"><h3>Begleitende Prozesse</h3></div>
    <div class="pz-begleitend">${begleitend.map(p => `<button class="chip" data-pz-open="${p.id}" title="${pzEsc(pzStatusLabel(p.aufnahmestatus))}">
      <span class="dot pz-${p.aufnahmestatus}"></span>${pzEsc(pzLabel(p))}</button>`).join("")}</div>` : '';

  return kopf + `
    <div class="pz-kette-legende">
      ${prozessConfig.aufnahmestatus.map(s => `<span><span class="dot pz-${s.value}"></span>${pzEsc(PZ_STATUS_KURZ[s.value] || s.label)}</span>`).join("")}
      <span><b style="color:var(--copper)">?</b> offene Fragen</span><span><b style="color:var(--red)">⚠</b> hakt</span>
    </div>
    <div class="pz-kette-wrap"><div class="pz-kette">${kette}</div></div>
    ${unten}
    ${begleitendHtml}`;
}

function renderPzGliedDetail(g, k, glieder, kz){
  const gliedVon = (id) => { const i = kz.findIndex(x => x.ids.has(id)); return i >= 0 ? glieder[i].titel : null; };
  const ein = verbindungen.filter(v => k.ids.has(v.nachId) && !k.ids.has(v.vonId));
  const aus = verbindungen.filter(v => k.ids.has(v.vonId) && !k.ids.has(v.nachId));
  const zeile = (v, andererId) => {
    const a = pzById(andererId);
    const gl = gliedVon(andererId);
    return `<li class="${v.problem ? 'hakt' : ''}">
      <div><b>${pzEsc(v.inhalt)}</b></div>
      <div class="small">${gl ? `${pzEsc(gl)} · ` : ''}<button class="clickable-text" data-pz-open="${a.id}">${pzEsc(pzLabel(a))}</button> · ${pzWegHtml(v.weg)}${v.problem ? ' · <span class="status-badge wartet_extern">Hakt</span>' : ''}</div>
    </li>`;
  };
  const sortiert = [...g.prozesse].sort((a, b) => pzAhnen(a).length - pzAhnen(b).length || a.reihenfolge - b.reihenfolge);
  const fragen = g.prozesse.filter(p => p.anzahlFragenOffen).sort((a, b) => b.anzahlFragenOffen - a.anzahlFragenOffen);
  return `
    <div class="timeline-head"><h3>${pzEsc(g.titel)}</h3>
      <button class="btn text" data-glied="${""}">Auswahl aufheben</button></div>
    <div class="pz-glied-detail">
      <div class="pz-glied-spalte">
        <div class="pz-spalten-titel">Bekommt von (${ein.length})</div>
        ${ein.length ? `<ul class="pz-uebergaben">${ein.map(v => zeile(v, v.vonId)).join("")}</ul>` : '<div class="pz-empty">Keine Übergabe erfasst.</div>'}
      </div>
      <div class="pz-glied-spalte">
        <div class="pz-spalten-titel">Prozesse (${g.prozesse.length})</div>
        <ul class="pz-glied-prozesse">${sortiert.map(p => `
          <li style="padding-left:${Math.max(0, pzAhnen(p).length - 2) * 14}px">
            <span class="dot pz-${p.aufnahmestatus}" title="${pzEsc(pzStatusLabel(p.aufnahmestatus))}"></span>
            <button class="clickable-text" data-pz-open="${p.id}">${pzEsc(pzLabel(p))}</button>
            <span class="small">${p.anzahlSchritte} Schr.${p.anzahlFragenOffen ? ` · <span style="color:var(--copper)">? ${p.anzahlFragenOffen}</span>` : ''}</span>
          </li>`).join("")}</ul>
      </div>
      <div class="pz-glied-spalte">
        <div class="pz-spalten-titel">Gibt weiter an (${aus.length})</div>
        ${aus.length ? `<ul class="pz-uebergaben">${aus.map(v => zeile(v, v.nachId)).join("")}</ul>` : '<div class="pz-empty">Keine Übergabe erfasst.</div>'}
      </div>
    </div>
    ${fragen.length ? `<p class="pz-intro" style="margin-top:12px;">${k.fragen} offene Fragen in diesem Glied – meiste bei ${fragen.slice(0, 3).map(p => `<button class="clickable-text" data-pz-open="${p.id}">${pzEsc(pzLabel(p))}</button> (${p.anzahlFragenOffen})`).join(", ")}.</p>` : ''}`;
}

  document.getElementById("pzMain").querySelectorAll("[data-glied]").forEach(btn => btn.addEventListener("click", () => {
    const i = btn.dataset.glied === "" ? null : parseInt(btn.dataset.glied, 10);
    pzKetteAuswahl = pzKetteAuswahl === i ? null : i;
    renderPzMain();
  }));
}

/* ---------- Schnittstellenkarte ---------- */
// Zwei Stufen, passend zu „von grob nach fein“:
//  grob – nur Hauptprozesse (Ebene unter F/K/U), Übergaben zusammengefasst
//  fein – alle beteiligten Prozesse, Teilprozesse in der Spalte ihres Hauptprozesses gestapelt
function pzBahn(p){
  const root = [...pzAhnen(p), p][0];
  const kennung = (root.nummer || root.bezeichnung || "").toUpperCase();
  if(kennung.startsWith("F")) return 0;
  if(kennung.startsWith("K")) return 1;
  if(kennung.startsWith("U")) return 2;
  return 3;
}
function pzHauptprozess(p){
  const kette = [...pzAhnen(p), p];
  return kette[1] || kette[0];
}
function pzKernSchluessel(p){
  for(const x of [p, ...pzAhnen(p).reverse()]){
    const idx = PZ_KARTE_KERN.indexOf(x.nummer);
    if(idx >= 0) return idx * 100000 + (x === p ? 0 : 1000) + p.reihenfolge;
  }
  return 99 * 100000 + p.reihenfolge;
}
function pzSpalte(p, modus){
  if(modus === "grob") return p;
  if(pzBahn(p) === 1){
    for(const x of [p, ...pzAhnen(p).reverse()]){
      if(PZ_KARTE_KERN.includes(x.nummer)) return x;
    }
  }
  return pzHauptprozess(p);
}

function pzKarteDaten(modus){
  if(modus !== "grob"){
    const ids = new Set();
    verbindungen.forEach(v => { ids.add(v.vonId); ids.add(v.nachId); });
    return {
      knoten: [...ids].map(pzById).filter(Boolean),
      kanten: verbindungen.map(v => ({ ...v, schluessel: `v${v.id}`, einzeln: [v] })),
    };
  }
  const gruppen = {};
  verbindungen.forEach(v => {
    const a = pzById(v.vonId), b = pzById(v.nachId);
    if(!a || !b) return;
    const ha = pzHauptprozess(a), hb = pzHauptprozess(b);
    if(ha.id === hb.id) return;  // Übergabe innerhalb desselben Hauptprozesses
    const k = `${ha.id}-${hb.id}`;
    (gruppen[k] = gruppen[k] || { vonId: ha.id, nachId: hb.id, einzeln: [] }).einzeln.push(v);
  });
  const kanten = Object.entries(gruppen).map(([k, g]) => {
    const zaehler = {};
    g.einzeln.forEach(v => { zaehler[v.weg] = (zaehler[v.weg] || 0) + 1; });
    const weg = Object.entries(zaehler).sort((x, y) => y[1] - x[1])[0][0];
    return {
      ...g, schluessel: `g${k}`, weg,
      problem: g.einzeln.some(v => v.problem),
      inhalt: g.einzeln.length === 1 ? g.einzeln[0].inhalt : `${g.einzeln.length} Übergaben`,
    };
  });
  const ids = new Set();
  kanten.forEach(k => { ids.add(k.vonId); ids.add(k.nachId); });
  return { knoten: [...ids].map(pzById), kanten };
}

function pzKarteLayout(daten, modus){
  const KW = 176, KH = 54, ZEILE = KH + 14, GAP = modus === "grob" ? 110 : 64, LINKS = 120, OBEN = 44, BAHN_ABSTAND = 96;
  // Spalten bilden (Bahn -> Spalten -> Knoten)
  const spalten = {};
  daten.knoten.forEach(p => {
    const kopf = pzSpalte(p, modus);
    const k = `${pzBahn(p)}-${kopf.id}`;
    (spalten[k] = spalten[k] || { bahn: pzBahn(p), kopf, knoten: [] }).knoten.push(p);
  });
  Object.values(spalten).forEach(s => s.knoten.sort((a, b) =>
    (a.id === s.kopf.id ? -1 : b.id === s.kopf.id ? 1 : 0) || (pzAhnen(a).length - pzAhnen(b).length) || (a.reihenfolge - b.reihenfolge)));
  const genutzt = [0, 1, 2, 3].filter(b => Object.values(spalten).some(s => s.bahn === b));
  const bahnTop = {};
  let y = OBEN;
  genutzt.forEach(b => {
    bahnTop[b] = y;
    const hoechste = Math.max(...Object.values(spalten).filter(s => s.bahn === b).map(s => s.knoten.length));
    y += hoechste * ZEILE - 14 + BAHN_ABSTAND;
  });
  const pos = {};
  const setzeSpalte = (s, x) => s.knoten.forEach((p, i) => { pos[p.id] = { x, y: bahnTop[s.bahn] + i * ZEILE }; });
  Object.values(spalten).filter(s => s.bahn === 1)
    .sort((a, b) => pzKernSchluessel(a.kopf) - pzKernSchluessel(b.kopf))
    .forEach((s, i) => setzeSpalte(s, LINKS + i * (KW + GAP)));
  [0, 2, 3].forEach(b => {
    const wunsch = (s) => {
      const ids = new Set(s.knoten.map(p => p.id));
      const xs = daten.kanten.filter(k => ids.has(k.vonId) || ids.has(k.nachId))
        .map(k => pos[ids.has(k.vonId) ? k.nachId : k.vonId]).filter(Boolean).map(q => q.x);
      return xs.length ? xs.reduce((a, c) => a + c, 0) / xs.length : 1e6 + s.kopf.reihenfolge;
    };
    let rechts = LINKS - GAP;
    Object.values(spalten).filter(s => s.bahn === b).map(s => ({ s, w: wunsch(s) }))
      .sort((a, c) => a.w - c.w).forEach(({ s, w }) => {
        const x = Math.max(w > 1e5 ? 0 : w, rechts + GAP, LINKS);
        setzeSpalte(s, x);
        rechts = x + KW;
      });
  });
  const breite = Math.max(LINKS + KW, ...Object.values(pos).map(q => q.x + KW)) + 60;
  const bahnen = genutzt.map(b => {
    const unten = Math.max(...Object.values(spalten).filter(s => s.bahn === b).map(s => bahnTop[b] + s.knoten.length * ZEILE - 14));
    return { bahn: b, oben: bahnTop[b], unten };
  });
  return { pos, KW, KH, breite, hoehe: y - BAHN_ABSTAND + 100, bahnen };
}

function pzBezier(p0, p1, p2, p3, t){
  const u = 1 - t;
  return u*u*u*p0 + 3*u*u*t*p1 + 3*u*t*t*p2 + t*t*t*p3;
}

function renderPzKarte(){
  const kopf = `
    <div class="pz-crumbs"><button class="clickable-text" data-pz-open="">Landkarte</button><span aria-hidden="true">›</span>Schnittstellenkarte</div>
    <div class="order-head"><div>
      <div class="komm">Wer übergibt was an wen – und auf welchem Weg?</div>
      <h2 class="display">Schnittstellenkarte</h2>
    </div></div>`;
  if(!verbindungen.length){
    return kopf + `<div class="no-selection">Noch keine Übergaben erfasst. Öffne einen Prozess und lege unter „Schnittstellen“ mit „+ Übergabe“ die erste an.</div>`;
  }
  const modus = pzKarteModus;
  const daten = pzKarteDaten(modus);
  const L = pzKarteLayout(daten, modus);
  const fokus = pzKarteFokus && L.pos[pzKarteFokus] ? pzKarteFokus : null;
  const nachbarn = new Set(fokus ? [fokus] : []);
  if(fokus) daten.kanten.forEach(k => {
    if(k.vonId === fokus) nachbarn.add(k.nachId);
    if(k.nachId === fokus) nachbarn.add(k.vonId);
  });

  // Mehrfachkanten zwischen denselben Prozessen auffächern
  const paare = {};
  daten.kanten.forEach(k => { const p = [k.vonId, k.nachId].sort().join("-"); (paare[p] = paare[p] || []).push(k.schluessel); });

  const marker = Object.entries(PZ_WEG_FARBEN).map(([weg, farbe]) =>
    `<marker id="pzPfeil-${weg}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${farbe}"/></marker>`).join("");

  const belegt = [];  // bereits gesetzte Kantenbeschriftungen
  const kanten = daten.kanten.map(k => {
    const a = L.pos[k.vonId], b = L.pos[k.nachId];
    if(!a || !b) return "";
    const pk = [k.vonId, k.nachId].sort().join("-");
    const off = (paare[pk].indexOf(k.schluessel) - (paare[pk].length - 1) / 2) * 12;
    let x0, y0, x1, y1, x2, y2, x3, y3;
    if(a.x === b.x){
      // gleiche Spalte: seitlicher Bogen rechts
      x0 = a.x + L.KW; y0 = a.y + L.KH / 2 + off; x3 = b.x + L.KW; y3 = b.y + L.KH / 2 + off;
      const bogen = 26 + Math.abs(b.y - a.y) * 0.15;
      x1 = x0 + bogen; y1 = y0; x2 = x3 + bogen; y2 = y3;
    } else if(pzBahnVon(a, L) === pzBahnVon(b, L)){
      // gleiche Bahn, andere Spalte: von Seite zu Seite; rückwärts gerichtete Übergaben laufen unten herum
      const rechts = b.x > a.x;
      x0 = rechts ? a.x + L.KW : a.x; y0 = a.y + L.KH / 2 + off;
      x3 = rechts ? b.x : b.x + L.KW; y3 = b.y + L.KH / 2 + off;
      if(rechts){ const dx = (x3 - x0) * 0.5; x1 = x0 + dx; y1 = y0; x2 = x3 - dx; y2 = y3; }
      else { x1 = x0 - 50; y1 = y0 + 46; x2 = x3 + 50; y2 = y3 + 46; }
    } else {
      const runter = b.y > a.y;
      x0 = a.x + L.KW / 2 + off; y0 = runter ? a.y + L.KH : a.y;
      x3 = b.x + L.KW / 2 + off; y3 = runter ? b.y : b.y + L.KH;
      const dy = (y3 - y0) * 0.5;
      x1 = x0; y1 = y0 + dy; x2 = x3; y2 = y3 - dy;
    }
    const d = `M${x0},${y0} C${x1},${y1} ${x2},${y2} ${x3},${y3}`;
    const farbe = PZ_WEG_FARBEN[k.weg] || PZ_WEG_FARBEN.sonstiges;
    const aktiv = fokus ? (k.vonId === fokus || k.nachId === fokus) : !pzKarteNurProbleme || k.problem;
    const titel = `${pzLabel(pzById(k.vonId))} → ${pzLabel(pzById(k.nachId))}\n` +
      k.einzeln.map(v => `• ${v.inhalt} (${pzWegLabel(v.weg)})${v.problem ? ' – hakt' : ''}`).join("\n");
    let label = "";
    if(fokus && aktiv){
      const mx = pzBezier(x0, x1, x2, x3, 0.5);
      let my = pzBezier(y0, y1, y2, y3, 0.5) - 5;
      const text = k.inhalt.length > 38 ? k.inhalt.slice(0, 36) + "…" : k.inhalt;
      const breite = text.length * 6;
      while(belegt.some(r => Math.abs(r.x - mx) < (r.b + breite) / 2 && Math.abs(r.y - my) < 14)) my += 14;
      belegt.push({ x: mx, y: my, b: breite });
      label = `<text x="${mx}" y="${my}" text-anchor="middle" class="pz-kanten-label">${pzEsc(text)}</text>`;
    }
    const staerke = Math.min(1.8 + (k.einzeln.length - 1) * 0.6, 4.5) + (fokus && aktiv ? 0.6 : 0);
    return `<g class="pz-kante" data-kante="${k.schluessel}" opacity="${aktiv ? 1 : 0.1}">
      <title>${pzEsc(titel)}</title>
      ${k.problem ? `<path d="${d}" fill="none" stroke="#B0432E" stroke-opacity="0.3" stroke-width="${staerke + 7}" stroke-linecap="round"/>` : ''}
      <path d="${d}" fill="none" stroke="transparent" stroke-width="12"/>
      <path d="${d}" fill="none" stroke="${farbe}" stroke-width="${staerke}" ${k.weg === 'unklar' ? 'stroke-dasharray="5 4"' : ''} marker-end="url(#pzPfeil-${k.weg in PZ_WEG_FARBEN ? k.weg : 'sonstiges'})"/>
      ${label}
    </g>`;
  }).join("");

  const knoten = daten.knoten.map(p => {
    const q = L.pos[p.id];
    const aktiv = !fokus || nachbarn.has(p.id);
    const name = p.bezeichnung.length > 24 ? p.bezeichnung.slice(0, 22) + "…" : p.bezeichnung;
    const hakt = daten.kanten.some(k => k.problem && (k.vonId === p.id || k.nachId === p.id));
    const unter = modus === "grob" ? pzNachkommen(p.id).length : 0;
    const fragen = modus === "grob" ? pzSumme(p, "anzahlFragenOffen") : p.anzahlFragenOffen;
    return `<g class="pz-knoten" data-knoten="${p.id}" opacity="${aktiv ? 1 : 0.25}">
      <title>${pzEsc(pzLabel(p))} – ${pzEsc(pzStatusLabel(p.aufnahmestatus))}${fragen ? ` – ${fragen} offene Fragen` : ''}${unter ? ` – ${unter} Teilprozesse` : ''}</title>
      <rect x="${q.x}" y="${q.y}" width="${L.KW}" height="${L.KH}" rx="4" fill="#FFFFFF"
            stroke="${p.id === fokus ? '#2C4A63' : hakt ? '#B0432E' : '#DCDFDA'}" stroke-width="${p.id === fokus ? 2.5 : 1.2}"/>
      ${unter ? `<rect x="${q.x + 3}" y="${q.y + L.KH}" width="${L.KW - 6}" height="3" rx="1" fill="#DCDFDA"/>` : ''}
      <circle cx="${q.x + 12}" cy="${q.y + 15}" r="4" class="pz-knoten-dot pz-${p.aufnahmestatus}"/>
      <text x="${q.x + 22}" y="${q.y + 19}" class="pz-knoten-nr">${pzEsc(p.nummer || '')}${unter ? ` · ${unter} Teilpr.` : ''}</text>
      ${fragen ? `<text x="${q.x + L.KW - 8}" y="${q.y + 19}" text-anchor="end" class="pz-knoten-fragen">? ${fragen}</text>` : ''}
      <text x="${q.x + 10}" y="${q.y + 40}" class="pz-knoten-name">${pzEsc(name)}</text>
    </g>`;
  }).join("");

  const bahnNamen = ["Führung", "Kern", "Unterstützung", "Sonstige"];
  const bahnen = L.bahnen.map((b, i) => `
    <rect x="0" y="${b.oben - 18}" width="100%" height="${b.unten - b.oben + 36}" fill="${i % 2 ? '#F4F5F2' : '#FAFAF8'}"/>
    <text x="12" y="${b.oben + L.KH / 2 + 4}" class="pz-bahn-name">${bahnNamen[b.bahn]}</text>`).join("");

  const legende = prozessConfig.wege.map(w => pzWegHtml(w.value)).join("") +
    `<span class="pz-weg"><span class="pz-weg-linie" style="background:#B0432E; opacity:0.45; height:7px;"></span>Hakt</span>`;

  let info;
  if(fokus){
    const p = pzById(fokus);
    const ids = modus === "grob" ? [p.id, ...pzNachkommen(p.id)] : [p.id];
    info = `<div class="timeline-head" style="margin-top:22px;">
        <h3>${pzEsc(pzLabel(p))}${modus === "grob" && ids.length > 1 ? ` <span style="text-transform:none; letter-spacing:0; font-weight:400;">(mit ${ids.length - 1} Teilprozessen)</span>` : ''}</h3>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button class="btn text" id="pzKarteFokusWeg">Auswahl aufheben</button>
          <button class="btn ghost small" data-pz-open="${p.id}">Prozess öffnen</button>
          <button class="btn ghost small" id="pzKarteNeu">+ Übergabe</button>
        </div>
      </div>
      ${renderPzVerbindungsListe(ids, null)}`;
  } else {
    info = `<p class="pz-intro" style="margin-top:14px;">${modus === "grob"
      ? "<b>Grob:</b> nur Hauptprozesse, Übergaben zwischen ihren Teilprozessen sind zusammengefasst (dickere Linie = mehr Übergaben). Übergaben innerhalb eines Hauptprozesses sieht man unter „Fein“."
      : "<b>Fein:</b> alle Teilprozesse, gestapelt in der Spalte ihres Hauptprozesses."}
      Klick auf einen Prozess hebt seine Übergaben mit Beschriftung hervor. Rot unterlegt = hier hakt es – dort liegen meist die wichtigsten Anforderungen an ein mögliches ERP-System.</p>`;
  }

  return kopf + `
    <div class="pz-toolbar">
      <span class="label">Ansicht</span>
      <button class="chip ${modus === 'grob' ? 'active' : ''}" data-karte-modus="grob">Grob – Hauptprozesse</button>
      <button class="chip ${modus === 'fein' ? 'active' : ''}" data-karte-modus="fein">Fein – alle Teilprozesse</button>
      <label class="pz-weg" style="margin-left:auto; cursor:pointer;"><input type="checkbox" id="pzNurProbleme" ${pzKarteNurProbleme ? 'checked' : ''}> nur wo es hakt</label>
    </div>
    <div class="pz-toolbar"><span class="label">Weg</span>${legende}</div>
    <div class="pz-karte-wrap">
      <svg id="pzKarteSvg" width="${L.breite}" height="${L.hoehe}" style="min-width:100%;" role="img" aria-label="Schnittstellenkarte der Prozesse">
        <defs>${marker}</defs>
        <rect x="0" y="0" width="100%" height="100%" fill="transparent"/>
        ${bahnen}${kanten}${knoten}
      </svg>
    </div>
    ${info}
    ${renderPzMatrix(daten, L)}`;
}

function pzBahnVon(q, L){
  return L.bahnen.find(b => q.y >= b.oben - 1 && q.y <= b.unten)?.bahn;
}

function renderPzMatrix(daten, L){
  const reihen = [...daten.knoten].sort((a, b) => (pzBahn(a) - pzBahn(b)) || (L.pos[a.id].x - L.pos[b.id].x) || (L.pos[a.id].y - L.pos[b.id].y));
  const kurz = (p) => pzEsc(p.nummer || (p.bezeichnung.length > 18 ? p.bezeichnung.slice(0, 16) + "…" : p.bezeichnung));
  const kopf = reihen.map(p => `<th class="pz-matrix-spalte" title="${pzEsc(pzLabel(p))}"><span>${kurz(p)}</span></th>`).join("");
  const zeilen = reihen.map(von => `<tr><th title="${pzEsc(pzLabel(von))}">${pzEsc(pzLabel(von))}</th>${reihen.map(nach => {
    if(von.id === nach.id) return `<td class="pz-matrix-leer"></td>`;
    const k = daten.kanten.find(x => x.vonId === von.id && x.nachId === nach.id);
    return `<td>${k ? k.einzeln.map(v => `<span class="pz-matrix-punkt ${v.problem ? 'hakt' : ''}" style="background:${PZ_WEG_FARBEN[v.weg] || PZ_WEG_FARBEN.sonstiges};" title="${pzEsc(v.inhalt)} (${pzEsc(pzWegLabel(v.weg))})${v.problem ? ' – hakt' : ''}"></span>`).join("") : ''}</td>`;
  }).join("")}</tr>`).join("");
  return `
    <details class="pz-details"><summary>Schnittstellenmatrix anzeigen (${pzKarteModus === "grob" ? "grob" : "fein"})</summary>
    <p class="pz-intro" style="margin:4px 0 8px;">Zeile übergibt an Spalte. Ein Punkt je Übergabe, Farbe = Weg, roter Rand = hakt. Maus über einen Punkt zeigt den Inhalt.</p>
    <div class="pz-table-wrap"><table class="pz-matrix"><thead><tr><th>von \\ an</th>${kopf}</tr></thead><tbody>${zeilen}</tbody></table></div>
    </details>`;
}

function bindPzKarte(){
  const main = document.getElementById("pzMain");
  const svg = document.getElementById("pzKarteSvg");
  document.getElementById("pzNurProbleme")?.addEventListener("change", (ev) => {
    pzKarteNurProbleme = ev.target.checked;
    renderPzMain();
  });
  main.querySelectorAll("[data-karte-modus]").forEach(btn => btn.addEventListener("click", () => {
    pzKarteModus = btn.dataset.karteModus;
    // Fokus in der anderen Stufe auf den passenden Prozess umsetzen
    if(pzKarteFokus && pzKarteModus === "grob") pzKarteFokus = pzHauptprozess(pzById(pzKarteFokus)).id;
    try{ localStorage.setItem("pzKarteModus", pzKarteModus); }catch(e){}
    renderPzMain();
  }));
  if(svg){
    svg.addEventListener("click", (ev) => {
      const k = ev.target.closest("[data-knoten]");
      if(k){
        const id = parseInt(k.dataset.knoten, 10);
        pzKarteFokus = pzKarteFokus === id ? null : id;
        renderPzMain();
        return;
      }
      const kante = ev.target.closest("[data-kante]");
      if(kante){
        const schluessel = kante.dataset.kante;
        if(schluessel.startsWith("v")){
          const v = verbindungen.find(x => x.id === parseInt(schluessel.slice(1), 10));
          openPzVerbindungModal(pzKarteFokus && (v.vonId === pzKarteFokus || v.nachId === pzKarteFokus) ? pzKarteFokus : v.vonId, v);
        } else {
          // zusammengefasste Übergabe: Fokus auf den abgebenden Hauptprozess
          pzKarteFokus = parseInt(schluessel.slice(1).split("-")[0], 10);
          renderPzMain();
        }
        return;
      }
      if(pzKarteFokus !== null){
        pzKarteFokus = null;
        renderPzMain();
      }
    });
  }
  document.getElementById("pzKarteFokusWeg")?.addEventListener("click", () => { pzKarteFokus = null; renderPzMain(); });
  document.getElementById("pzKarteNeu")?.addEventListener("click", () => openPzVerbindungModal(pzKarteFokus, null));
  bindPzVerbindungsAktionen(main, pzKarteFokus);
}

/* ===================== Toast ===================== */
let toastTimer = null;
function showToast(msg, isError){
  const root = document.getElementById("toastRoot");
  root.innerHTML = `<div class="toast ${isError ? 'error' : ''}" role="status">${msg}</div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { root.innerHTML = ""; }, 2600);
}

/* ===================== Init ===================== */
async function init(){
  document.getElementById("main").innerHTML = `<div class="no-selection">Lädt…</div>`;
  try{
    await Promise.all([loadUsers(), loadItems("anfrage"), loadItems("auftrag"), loadItems("angebot")]);
  }catch(err){
    document.getElementById("main").innerHTML = `<div class="no-selection">Daten konnten nicht geladen werden. Läuft der Server?</div>`;
    return;
  }
  renderFilterChips();
  renderSortSelect();
  renderNewItemButton();
  renderList();
  renderMain();
  updateStats();
}
init();
