<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auftragspipeline — Projektbesprechung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2F3EF; --panel:#FFFFFF; --ink:#1B2430;
    --steel:#2C4A63; --steel-deep:#1E3547; --steel-soft:#E4EAEE;
    --slate:#6C7A85; --slate-light:#A9B2B9; --line:#DCDFDA;
    --copper:#9C5A34; --copper-soft:#EFE2D6;
    --red:#B0432E; --red-soft:#F6E1DC;
    --amber:#C4872A; --amber-soft:#F6EAD5;
    --green:#4B7A56; --green-soft:#DFEBE2;
    --radius:3px; --shadow:0 1px 2px rgba(27,36,48,0.06), 0 4px 14px rgba(27,36,48,0.05);
    font-size:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--paper); color:var(--ink); font-family:'IBM Plex Sans', sans-serif; -webkit-font-smoothing:antialiased; }
  .mono{font-family:'IBM Plex Mono', monospace; letter-spacing:0.01em;}
  .display{font-family:'Archivo', sans-serif; font-weight:700;}
  a{color:inherit;} button{font-family:inherit;}

  .app{ display:grid; grid-template-columns:340px 1fr; grid-template-rows:auto auto 1fr; min-height:100vh; }
  @media (max-width: 880px){ .app{grid-template-columns:1fr;} .sidebar{border-right:none; border-bottom:1px solid var(--line);} }

  .topbar{ grid-column:1 / -1; display:flex; align-items:center; gap:14px; padding:14px 24px; background:var(--steel-deep); color:#EDEFEA; flex-wrap:wrap; }
  .topbar .mark{ width:30px; height:30px; display:flex; align-items:center; justify-content:center; }
  .topbar h1{ font-size:1.05rem; margin:0; letter-spacing:0.01em; }
  .topbar .sub{ font-size:0.78rem; color:#A9BAC4; margin-left:2px; }
  .topbar .stat{ margin-left:auto; font-family:'IBM Plex Mono', monospace; font-size:0.78rem; color:#C7D3D8; display:flex; gap:18px; }
  .topbar .stat b{color:#EDEFEA; font-weight:600;}

  .tabbar{ grid-column:1 / -1; display:flex; gap:2px; background:var(--steel); padding:0 24px; }
  .tab-btn{ background:none; border:none; color:#CFE0E7; padding:10px 18px; font-size:0.85rem; font-weight:600; cursor:pointer; border-bottom:2px solid transparent; }
  .tab-btn:hover{color:#fff;}
  .tab-btn:focus-visible{outline:2px solid #fff; outline-offset:-2px;}
  .tab-btn.active{ color:#fff; border-bottom-color:var(--copper); }

  .sidebar{ border-right:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; min-height:0; overflow:hidden; }
  .sidebar-controls{ padding:16px 16px 12px; border-bottom:1px solid var(--line); }
  .search{ width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:var(--radius); font-size:0.88rem; font-family:inherit; background:var(--paper); color:var(--ink); }
  .search:focus-visible{outline:2px solid var(--steel); outline-offset:1px;}

  .prio-filters{ display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  .chip{ border:1px solid var(--line); background:var(--panel); padding:5px 10px; border-radius:20px; font-size:0.74rem; cursor:pointer; display:flex; align-items:center; gap:6px; color:var(--slate); }
  .chip:hover{border-color:var(--slate-light);}
  .chip:focus-visible{outline:2px solid var(--steel); outline-offset:1px;}
  .chip.active{border-color:var(--ink); color:var(--ink); font-weight:600;}
  .dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .dot.rot{background:var(--red);} .dot.gelb{background:var(--amber);} .dot.gruen{background:var(--green);}
  .dot.in_bearbeitung{background:var(--steel);} .dot.versendet{background:var(--amber);}
  .dot.wiedervorlage{background:var(--copper);} .dot.gewonnen{background:var(--green);} .dot.verloren{background:var(--red);}

  .order-list{ overflow-y:auto; flex:1; padding:8px; }
  .order-card{ width:100%; text-align:left; background:var(--panel); border:1px solid var(--line); border-left:3px solid transparent; border-radius:var(--radius); padding:12px 13px; margin-bottom:7px; cursor:pointer; display:block; }
  .order-card:hover{border-color:var(--slate-light);}
  .order-card:focus-visible{outline:2px solid var(--steel); outline-offset:1px;}
  .order-card.selected{ background:#F7F8F6; box-shadow:var(--shadow); }
  .order-card.rot{border-left-color:var(--red);} .order-card.gelb{border-left-color:var(--amber);} .order-card.gruen{border-left-color:var(--green);}
  .order-card.in_bearbeitung{border-left-color:var(--steel);} .order-card.versendet{border-left-color:var(--amber);}
  .order-card.wiedervorlage{border-left-color:var(--copper);} .order-card.gewonnen{border-left-color:var(--green);} .order-card.verloren{border-left-color:var(--red);}
  .order-card .komm{font-size:0.78rem; color:var(--slate); margin-bottom:3px;}
  .order-card .kunde{font-weight:600; font-size:0.92rem; margin-bottom:5px;}
  .order-card .meta{ display:flex; justify-content:space-between; align-items:center; font-size:0.72rem; color:var(--slate); gap:6px; }
  .status-badge{ font-size:0.68rem; padding:2px 7px; border-radius:20px; font-weight:600; text-transform:uppercase; letter-spacing:0.03em; white-space:nowrap; }
  .status-badge.offen{background:var(--copper-soft); color:var(--copper);}
  .status-badge.erledigt{background:var(--green-soft); color:var(--green);}
  .status-badge.in_bearbeitung{background:var(--steel-soft); color:var(--steel);}
  .status-badge.versendet{background:var(--amber-soft); color:var(--amber);}
  .status-badge.wiedervorlage{background:var(--copper-soft); color:var(--copper);}
  .status-badge.gewonnen{background:var(--green-soft); color:var(--green);}
  .status-badge.verloren{background:var(--red-soft); color:var(--red);}
  .empty-list{ padding:30px 16px; color:var(--slate); font-size:0.85rem; text-align:center; }

  .main{ padding:28px 40px 60px; max-width:820px; overflow-y:auto; min-height:0; }
  @media (max-width: 880px){ .main{padding:20px;} }
  .no-selection{ color:var(--slate); padding-top:80px; text-align:center; font-size:0.95rem; }

  .order-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:6px; }
  .order-head .komm{ font-size:0.85rem; color:var(--slate); margin-bottom:4px; }
  .order-head h2{ font-size:1.5rem; margin:0 0 2px; }
  .prio-tag{ display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:20px; font-size:0.76rem; font-weight:600; white-space:nowrap; margin-top:2px; }
  .prio-tag.rot{background:var(--red-soft); color:var(--red);} .prio-tag.gelb{background:var(--amber-soft); color:var(--amber);} .prio-tag.gruen{background:var(--green-soft); color:var(--green);}
  .prio-tag.in_bearbeitung{background:var(--steel-soft); color:var(--steel);} .prio-tag.versendet{background:var(--amber-soft); color:var(--amber);}
  .prio-tag.wiedervorlage{background:var(--copper-soft); color:var(--copper);} .prio-tag.gewonnen{background:var(--green-soft); color:var(--green);} .prio-tag.verloren{background:var(--red-soft); color:var(--red);}

  .order-meta-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; margin:20px 0 8px; padding:16px; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); }
  @media (max-width: 620px){ .order-meta-grid{grid-template-columns:1fr 1fr;} }
  .order-meta-grid .field label{ display:block; font-size:0.68rem; text-transform:uppercase; letter-spacing:0.04em; color:var(--slate); margin-bottom:4px; }
  .order-meta-grid .field .val{font-size:0.9rem;} .order-meta-grid .field .val.mono{font-size:0.85rem;}

  .lieferumfang{ margin:16px 0 26px; font-size:0.92rem; color:var(--ink); line-height:1.5; }
  .lieferumfang .label{ font-size:0.68rem; text-transform:uppercase; letter-spacing:0.04em; color:var(--slate); display:block; margin-bottom:4px; }

  .folder-link{ display:inline-flex; align-items:center; gap:6px; font-size:0.82rem; color:var(--steel); text-decoration:none; border-bottom:1px solid transparent; }
  .folder-link:hover{border-bottom-color:var(--steel);} .folder-link svg{flex-shrink:0;}

  .timeline-head{ display:flex; justify-content:space-between; align-items:center; margin:34px 0 4px; }
  .timeline-head h3{ font-size:0.95rem; margin:0; text-transform:uppercase; letter-spacing:0.04em; color:var(--slate); }
  .btn{ font-size:0.82rem; font-weight:600; padding:7px 14px; border-radius:var(--radius); border:1px solid var(--steel); background:var(--steel); color:#fff; cursor:pointer; }
  .btn:hover{background:var(--steel-deep); border-color:var(--steel-deep);}
  .btn:focus-visible{outline:2px solid var(--copper); outline-offset:2px;}
  .btn.ghost{ background:transparent; color:var(--steel); } .btn.ghost:hover{background:#EAEEF0;}
  .btn.small{padding:5px 10px; font-size:0.74rem;}
  .btn.text{ background:none; border:none; color:var(--steel); font-size:0.78rem; font-weight:600; padding:4px 0; cursor:pointer; }
  .btn.text:hover{text-decoration:underline;} .btn.text:focus-visible{outline:2px solid var(--steel); outline-offset:2px;}
  .btn:disabled{opacity:0.6; cursor:default;}

  .pipeline{ position:relative; margin-top:18px; padding-left:26px; }
  .pipeline::before{ content:""; position:absolute; left:6px; top:6px; bottom:6px; width:2px; background:var(--line); }
  .entry{ position:relative; padding-bottom:26px; } .entry:last-child{padding-bottom:0;}
  .entry .node{ position:absolute; left:-26px; top:2px; width:14px; height:14px; border-radius:50%; background:var(--panel); border:2px solid var(--slate-light); }
  .entry.erledigt .node{border-color:var(--green); background:var(--green-soft);}
  .entry.hat-aufgabe .node{border-color:var(--copper);}
  .entry-card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:13px 15px; }
  .entry-top{ display:flex; justify-content:space-between; gap:10px; align-items:flex-start; margin-bottom:6px; }
  .entry-meta{ font-size:0.72rem; color:var(--slate); } .entry-meta b{color:var(--ink); font-weight:600;}
  .entry-text{font-size:0.88rem; line-height:1.5; margin:0 0 10px;}
  .entry-foot{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
  .entry-due{ font-size:0.74rem; color:var(--copper); font-family:'IBM Plex Mono', monospace; } .entry-due.none{color:var(--slate-light);}
  .task-badge{ font-size:0.7rem; background:var(--copper-soft); color:var(--copper); padding:3px 9px; border-radius:20px; font-weight:600; }

  .new-entry-form{ background:var(--panel); border:1px dashed var(--slate-light); border-radius:var(--radius); padding:14px 15px; margin-top:14px; }
  .new-entry-form textarea, .new-entry-form select, .new-entry-form input{ width:100%; font-family:inherit; font-size:0.85rem; padding:8px 10px; border:1px solid var(--line); border-radius:var(--radius); background:var(--paper); color:var(--ink); margin-top:4px; }
  .new-entry-form textarea:focus-visible, .new-entry-form select:focus-visible, .new-entry-form input:focus-visible{ outline:2px solid var(--steel); outline-offset:1px; }
  .form-row{margin-bottom:10px;}
  .form-row label{font-size:0.72rem; color:var(--slate); text-transform:uppercase; letter-spacing:0.03em;}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .form-actions{display:flex; gap:8px; margin-top:4px; justify-content:flex-end;}

  .modal-backdrop{ position:fixed; inset:0; background:rgba(27,36,48,0.45); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50; }
  .modal{ background:var(--panel); border-radius:var(--radius); max-width:440px; width:100%; padding:24px; box-shadow:0 10px 40px rgba(0,0,0,0.25); }
  .modal h3{margin:0 0 4px; font-size:1.05rem;} .modal .sub{font-size:0.8rem; color:var(--slate); margin-bottom:18px;}
  .modal .form-row label{display:block; margin-bottom:4px;} .modal .form-row{margin-bottom:14px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:20px;}

  .toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--steel-deep); color:#EDEFEA; padding:12px 20px; border-radius:var(--radius); font-size:0.85rem; box-shadow:var(--shadow); z-index:60; display:flex; align-items:center; gap:10px; }
  .toast.error{background:var(--red);}

  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }

  /* ===== Gantt ===== */
  .gantt-board{
    grid-column: 1 / -1;
    display:flex;
    flex-direction:column;
    overflow:auto;
    min-height:0;
    padding:20px 24px;
  }
  .gantt-inner{ position:relative; min-width:max-content; }
  .gantt-header{
    display:flex;
    position:sticky;
    top:0;
    background:var(--paper);
    z-index:2;
    border-bottom:1px solid var(--line);
    padding-bottom:6px;
    margin-bottom:8px;
  }
  .gantt-header .row-label-spacer{ flex-shrink:0; }
  .gantt-week{
    flex-shrink:0;
    font-size:0.7rem;
    color:var(--slate);
    text-align:center;
    border-left:1px solid var(--line);
    padding-left:4px;
  }
  .gantt-row{
    display:flex;
    align-items:center;
    height:38px;
    border-bottom:1px solid #EDEEEA;
  }
  .gantt-row-label{
    flex-shrink:0;
    font-size:0.78rem;
    padding-right:10px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .gantt-row-label .komm{ font-family:'IBM Plex Mono', monospace; font-size:0.68rem; color:var(--slate); display:block; }
  .gantt-track{ position:relative; flex:1; height:100%; }
  .gantt-bar{
    position:absolute;
    top:8px;
    height:22px;
    border-radius:11px;
    cursor:pointer;
    display:flex;
    align-items:center;
    padding:0 10px;
    font-size:0.72rem;
    font-weight:600;
    color:#fff;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    box-shadow:var(--shadow);
  }
  .gantt-bar.rot{ background:var(--red); }
  .gantt-bar.gelb{ background:var(--amber); }
  .gantt-bar.gruen{ background:var(--green); }
  .gantt-bar:hover{ filter:brightness(0.92); }
  .gantt-today-line{
    position:absolute;
    top:0; bottom:0;
    width:2px;
    background:var(--copper);
    z-index:1;
  }

  /* ===== Detailliertes Gantt je Auftrag ===== */
  .order-timeline-scroll{
    overflow-x:auto;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--panel);
    padding:14px 16px 16px;
    margin-top:16px;
  }
  .order-timeline-inner{ position:relative; min-width:max-content; }
  .order-timeline-header{
    display:flex;
    border-bottom:1px solid var(--line);
    padding-bottom:6px;
    margin-bottom:6px;
  }
  .order-timeline-label-spacer{ flex-shrink:0; }
  .order-timeline-week{
    flex-shrink:0;
    font-size:0.68rem;
    color:var(--slate);
    text-align:center;
    border-left:1px solid var(--line);
    padding-left:4px;
  }
  .order-timeline-row{ display:flex; align-items:center; height:34px; }
  .order-timeline-label{
    flex-shrink:0;
    font-size:0.76rem;
    padding-right:10px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .order-timeline-track{ position:relative; flex:1; height:100%; }
  .order-timeline-bar{
    position:absolute;
    top:6px;
    height:20px;
    border-radius:4px;
    background:var(--steel);
    cursor:pointer;
    display:flex;
    align-items:center;
    padding:0 8px;
    font-size:0.68rem;
    font-weight:600;
    color:#fff;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    box-shadow:var(--shadow);
  }
  .order-timeline-bar:hover{ filter:brightness(0.92); }
  .order-timeline-marker{
    position:absolute;
    top:50%;
    width:10px;
    height:10px;
    background:var(--copper);
    border:2px solid var(--panel);
    border-radius:2px;
    transform:translate(-50%,-50%) rotate(45deg);
    box-shadow:var(--shadow);
  }
  .order-timeline-marker.erledigt{ background:var(--green); }
  .order-timeline-today{
    position:absolute;
    top:0; bottom:0;
    width:2px;
    background:var(--copper);
    opacity:0.45;
    z-index:1;
  }
  .order-timeline-empty{ color:var(--slate); font-size:0.85rem; padding:6px 2px 2px; }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="mark" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
        <circle cx="13" cy="13" r="11" stroke="#C7D3D8" stroke-width="1.6"/>
        <path d="M13 5V21M5 13H21" stroke="#C7D3D8" stroke-width="1.6"/>
        <circle cx="13" cy="13" r="3.4" fill="#9C5A34"/>
      </svg>
    </div>
    <h1 class="display">Auftragspipeline</h1>
    <span class="sub">Projektbesprechung · HETA Verfahrenstechnik</span>
    <div class="stat" id="statBar"></div>
  </div>

  <div class="tabbar" role="tablist" aria-label="Bereich wählen">
    <button class="tab-btn active" data-tab="auftrag" role="tab" aria-selected="true">Aufträge</button>
    <button class="tab-btn" data-tab="angebot" role="tab" aria-selected="false">Angebote</button>
    <button class="tab-btn" data-tab="gantt" role="tab" aria-selected="false">Gantt</button>
  </div>

  <div class="sidebar" id="sidebarPane">
    <div class="sidebar-controls">
      <input type="text" class="search" id="searchInput" placeholder="Suchen…" aria-label="Suchen">
      <div class="prio-filters" id="filterChips" role="group" aria-label="Filtern"></div>
      <button class="btn" id="newItemBtn" style="width:100%; margin-top:10px;"></button>
    </div>
    <div class="order-list" id="orderList"></div>
  </div>

  <div class="main" id="main"></div>
  <div class="gantt-board" id="ganttBoard" style="display:none;"></div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
const API = "/api";
let nutzer = [];
let itemsCache = { auftrag: [], angebot: [] };
let currentTab = "auftrag";
let selectedId = { auftrag: null, angebot: null };
let activeFilter = { auftrag: "alle", angebot: "alle" };
let searchTerm = { auftrag: "", angebot: "" };

/* ===================== Datumshilfen ===================== */
function daysBetween(a, b){ return Math.round((b - a) / 86400000); }
function mondayOfWeekContaining(d){
  const date = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
  const dow = date.getUTCDay() || 7;
  date.setUTCDate(date.getUTCDate() - dow + 1);
  return date;
}
function toUTCDateOnly(iso){ const d = new Date(iso + "T00:00:00Z"); return d; }
function isoDateStr(d){ return d.toISOString().slice(0, 10); }

const KIND_CONFIG = {
  auftrag: {
    itemLabel: "Auftrag",
    newItemLabel: "+ Neuer Auftrag",
    statusField: "prio",
    filterChips: [
      { value:"alle", label:"Alle" },
      { value:"rot", label:"Rot", dot:"rot" },
      { value:"gelb", label:"Gelb", dot:"gelb" },
      { value:"gruen", label:"Grün", dot:"gruen" }
    ],
    cardClass: (item) => item.prio,
    cardStatusBadge: (item) => `<span class="status-badge ${item.status}">${item.status}</span>`,
    cardMetaLeft: (item) => `Termin ${fmtDate(item.liefertermin)}`,
    detailTag: (item) => `<span class="prio-tag ${item.prio}"><span class="dot ${item.prio}"></span>Priorität ${({rot:"Rot",gelb:"Gelb",gruen:"Grün"})[item.prio]}</span>`,
    metaGrid: (item) => `
      <div class="field"><label>Liefertermin</label><div class="val mono">${fmtDate(item.liefertermin)}</div></div>
      <div class="field"><label>Status</label><div class="val"><span class="status-badge ${item.status}">${item.status}</span></div></div>
      <div class="field"><label>Projektordner</label><div class="val">${folderLink(item.ordnerPfad)}</div></div>
    `,
    stats: (list) => {
      const offen = list.filter(o => o.status === "offen").length;
      const tasks = list.flatMap(o => o.verlauf).filter(e => e.status === "offen" && e.verantwortlich).length;
      return `<span><b>${offen}</b> offene Aufträge</span><span><b>${tasks}</b> unerledigte Aufgaben</span>`;
    }
  },
  angebot: {
    itemLabel: "Angebot",
    newItemLabel: "+ Neues Angebot",
    statusField: "status",
    filterChips: [
      { value:"alle", label:"Alle" },
      { value:"in_bearbeitung", label:"In Bearbeitung", dot:"in_bearbeitung" },
      { value:"versendet", label:"Versendet", dot:"versendet" },
      { value:"wiedervorlage", label:"Wiedervorlage", dot:"wiedervorlage" },
      { value:"gewonnen", label:"Gewonnen", dot:"gewonnen" },
      { value:"verloren", label:"Verloren", dot:"verloren" }
    ],
    cardClass: (item) => item.status,
    cardStatusBadge: (item) => `<span class="status-badge ${item.status}">${statusLabel(item.status)}</span>`,
    cardMetaLeft: (item) => item.wiedervorlage ? `Wiedervorlage ${fmtDate(item.wiedervorlage)}` : (item.wert && item.wert !== "—" ? item.wert : "&nbsp;"),
    detailTag: (item) => `<span class="prio-tag ${item.status}"><span class="dot ${item.status}"></span>${statusLabel(item.status)}</span>`,
    metaGrid: (item) => `
      <div class="field"><label>Angebotswert</label><div class="val mono">${item.wert || '—'}</div></div>
      <div class="field"><label>Wiedervorlage</label><div class="val mono">${item.wiedervorlage ? fmtDate(item.wiedervorlage) : '—'}</div></div>
      <div class="field"><label>Angebotsordner</label><div class="val">${folderLink(item.ordnerPfad)}</div></div>
    `,
    stats: (list) => {
      const offen = list.filter(a => a.status !== "gewonnen" && a.status !== "verloren").length;
      const faellig = list.filter(a => a.wiedervorlage).length;
      return `<span><b>${offen}</b> laufende Angebote</span><span><b>${faellig}</b> Wiedervorlagen</span>`;
    }
  }
};

function statusLabel(s){
  return { in_bearbeitung:"In Bearbeitung", versendet:"Versendet", wiedervorlage:"Wiedervorlage", gewonnen:"Gewonnen", verloren:"Verloren" }[s] || s;
}
function fmtDate(iso){
  if(!iso) return "—";
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("de-DE", { day:"2-digit", month:"2-digit", year:"numeric" });
}
function folderLink(path){
  if(!path) return "—";
  return `<a class="folder-link" href="#" title="${path}" onclick="return false;">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z" stroke="currentColor" stroke-width="1.6"/></svg>
    Ordner öffnen
  </a>`;
}

/* ===================== API ===================== */
async function apiGet(path){
  const res = await fetch(API + path);
  if(!res.ok) throw new Error("Fehler beim Laden: " + res.status);
  return res.json();
}
async function apiDelete(path){
  const res = await fetch(API + path, { method: "DELETE" });
  if(!res.ok) throw new Error("Fehler beim Löschen: " + res.status);
}
async function apiPatch(path, body){
  const res = await fetch(API + path, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if(!res.ok) throw new Error("Fehler beim Aktualisieren: " + res.status);
  return res.json();
}
async function apiPost(path, body){
  const res = await fetch(API + path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if(!res.ok) throw new Error("Fehler beim Speichern: " + res.status);
  return res.json();
}

  nutzer = await apiGet("/users");
}
async function loadItems(kind){
  itemsCache[kind] = await apiGet("/items?type=" + kind);
  if(!selectedId[kind] && itemsCache[kind].length){

}

function renderGanttBoard(){
  const board = document.getElementById("ganttBoard");
  const DAY_W = 26;
  const ROW_LABEL_W = 220;
  const WEEKS_PAST = 1;
  const WEEKS_FUTURE = 10;

  const offene = itemsCache.auftrag.filter(a => a.status === "offen");
  const today = new Date();
  const todayUTC = new Date(Date.UTC(today.getFullYear(), today.getMonth(), today.getDate()));

  const rangeStart = mondayOfWeekContaining(todayUTC);
  rangeStart.setUTCDate(rangeStart.getUTCDate() - WEEKS_PAST * 7);
  const rangeEnd = new Date(rangeStart);
  rangeEnd.setUTCDate(rangeEnd.getUTCDate() + (WEEKS_PAST + WEEKS_FUTURE) * 7);
  const totalDays = daysBetween(rangeStart, rangeEnd);
  const totalWidth = totalDays * DAY_W;

  const weekCount = Math.ceil(totalDays / 7);
  let weekHeaderHtml = "";
  for(let i = 0; i < weekCount; i++){
    const wStart = new Date(rangeStart); wStart.setUTCDate(wStart.getUTCDate() + i * 7);
    const label = wStart.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" });
    weekHeaderHtml += `<div class="gantt-week" style="width:${7*DAY_W}px;">${label}</div>`;
  }

  const todayOffset = daysBetween(rangeStart, todayUTC) * DAY_W;

  const rowsHtml = offene.map(item => {
    const start = item.erstelltAm ? toUTCDateOnly(item.erstelltAm.slice(0, 10)) : rangeStart;
    const end = item.liefertermin ? toUTCDateOnly(item.liefertermin) : null;
    const clampedStart = start < rangeStart ? rangeStart : start;
    let barLeft = daysBetween(rangeStart, clampedStart) * DAY_W;
    let barWidth;
    if(end){
      const clampedEnd = end > rangeEnd ? rangeEnd : end;
      barWidth = Math.max(daysBetween(clampedStart, clampedEnd) * DAY_W, 18);
    } else {
      barWidth = DAY_W; // kein Termin: schmaler Marker
    }
    return `
      <div class="gantt-row">
        <div class="gantt-row-label" style="width:${ROW_LABEL_W}px;">
          <span class="komm">${item.kommission}</span>${item.kunde}
        </div>
        <div class="gantt-track" style="width:${totalWidth}px;">
          <div class="gantt-bar ${item.prio}" data-id="${item.id}" style="left:${barLeft}px; width:${barWidth}px;" title="${item.kommission} — ${item.kunde}">
            ${item.liefertermin ? fmtDate(item.liefertermin) : 'kein Termin'}
          </div>
        </div>
      </div>
    `;
  }).join("");

  board.innerHTML = `
    <div class="gantt-inner">
      <div class="gantt-header">
        <div class="row-label-spacer" style="width:${ROW_LABEL_W}px;"></div>
        ${weekHeaderHtml}
      </div>
      <div style="position:relative;">
        <div class="gantt-today-line" style="left:${ROW_LABEL_W + todayOffset}px;"></div>
        ${rowsHtml || '<div class="no-selection" style="padding-top:20px;">Keine offenen Aufträge.</div>'}
      </div>
    </div>
  `;

  board.querySelectorAll(".gantt-bar").forEach(bar => {
    bar.addEventListener("click", () => {
      const item = itemsCache.auftrag.find(a => a.id === parseInt(bar.dataset.id, 10));
      if(item) openLiefertermineDialog(item);
    });
  });
}

        <h3 id="dueModalTitle">Liefertermin ändern</h3>
        <div class="sub">${item.kommission} — ${item.kunde}</div>

/* ===================== Detailliertes Gantt je Auftrag ===================== */
function renderOrderTimeline(item){
  const board = document.getElementById("orderTimelineBoard");
  if(!board) return;

  const phases = item.phasen || [];
  const events = item.verlauf.filter(e => e.faelligkeit);

  if(phases.length === 0 && events.length === 0){
    board.innerHTML = `<div class="order-timeline-empty">Noch keine Phasen angelegt. Mit „+ Phase" den Zeitplan für diesen Auftrag aufbauen.</div>`;
    return;
  }

  const DAY_W = 24;
  const LABEL_W = 170;

  const dates = [];
  if(item.erstelltAm) dates.push(toUTCDateOnly(item.erstelltAm.slice(0, 10)));
  if(item.liefertermin) dates.push(toUTCDateOnly(item.liefertermin));
  phases.forEach(p => { dates.push(toUTCDateOnly(p.start)); dates.push(toUTCDateOnly(p.ende)); });
  events.forEach(e => dates.push(toUTCDateOnly(e.faelligkeit)));

  const today = new Date();
  const todayUTC = new Date(Date.UTC(today.getFullYear(), today.getMonth(), today.getDate()));
  dates.push(todayUTC);

  const rangeStart = mondayOfWeekContaining(new Date(Math.min(...dates)));
  let rangeEnd = mondayOfWeekContaining(new Date(Math.max(...dates)));
  rangeEnd.setUTCDate(rangeEnd.getUTCDate() + 7);

  const totalDays = Math.max(daysBetween(rangeStart, rangeEnd), 7);
  const totalWidth = totalDays * DAY_W;

  const weekCount = Math.ceil(totalDays / 7);
  let weekHeaderHtml = "";
  for(let i = 0; i < weekCount; i++){
    const wStart = new Date(rangeStart); wStart.setUTCDate(wStart.getUTCDate() + i * 7);
    const label = wStart.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" });
    weekHeaderHtml += `<div class="order-timeline-week" style="width:${7*DAY_W}px;">${label}</div>`;
  }

  const todayOffset = daysBetween(rangeStart, todayUTC) * DAY_W;

  const phaseRowsHtml = phases.map(p => {
    const start = toUTCDateOnly(p.start);
    const end = toUTCDateOnly(p.ende);
    const left = daysBetween(rangeStart, start) * DAY_W;
    const width = Math.max(daysBetween(start, end) * DAY_W, 18);
    return `
      <div class="order-timeline-row">
        <div class="order-timeline-label" style="width:${LABEL_W}px;">${p.bezeichnung}</div>
        <div class="order-timeline-track" style="width:${totalWidth}px;">
          <div class="order-timeline-bar" data-id="${p.id}" style="left:${left}px; width:${width}px;" title="${p.bezeichnung}: ${fmtDate(p.start)} – ${fmtDate(p.ende)}">
            ${fmtDate(p.start)} – ${fmtDate(p.ende)}
          </div>
        </div>
      </div>
    `;
  }).join("");

  const eventsRowHtml = events.length ? `
    <div class="order-timeline-row">
      <div class="order-timeline-label" style="width:${LABEL_W}px;">Ereignisse</div>
      <div class="order-timeline-track" style="width:${totalWidth}px;">
        ${events.map(e => {
          const left = daysBetween(rangeStart, toUTCDateOnly(e.faelligkeit)) * DAY_W;
          const title = `${e.text} (fällig ${fmtDate(e.faelligkeit)}${e.verantwortlich ? ', ' + e.verantwortlich : ''})`.replace(/"/g, "&quot;");
          return `<div class="order-timeline-marker ${e.status === 'erledigt' ? 'erledigt' : ''}" style="left:${left}px;" title="${title}"></div>`;
        }).join("")}
      </div>
    </div>
  ` : "";

  board.innerHTML = `
    <div class="order-timeline-scroll">
      <div class="order-timeline-inner">
        <div class="order-timeline-header">
          <div class="order-timeline-label-spacer" style="width:${LABEL_W}px;"></div>
          ${weekHeaderHtml}
        </div>
        <div style="position:relative;">
          <div class="order-timeline-today" style="left:${LABEL_W + todayOffset}px;"></div>
          ${phaseRowsHtml}
          ${eventsRowHtml}
        </div>
      </div>
    </div>
  `;

  board.querySelectorAll(".order-timeline-bar").forEach(bar => {
    bar.addEventListener("click", () => {
      const phase = phases.find(p => p.id === parseInt(bar.dataset.id, 10));
      if(phase) openPhaseModal(item, phase);
    });
  });
}

function openPhaseModal(item, phase){
  const isEdit = !!phase;
  const root = document.getElementById("modalRoot");
  root.innerHTML = `
    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="phaseModalTitle">
        <h3 id="phaseModalTitle">${isEdit ? "Phase bearbeiten" : "Neue Phase"}</h3>
        <div class="sub">${item.kommission} — ${item.kunde}</div>
        <div class="form-row">
          <label for="phaseBezeichnung">Bezeichnung</label>
          <input type="text" id="phaseBezeichnung" placeholder="z.B. Konstruktion" value="${isEdit ? phase.bezeichnung : ''}">
        </div>
        <div class="form-grid">
          <div class="form-row">
            <label for="phaseStart">Start</label>
            <input type="date" id="phaseStart" value="${isEdit ? phase.start : ''}">
          </div>
          <div class="form-row">
            <label for="phaseEnde">Ende</label>
            <input type="date" id="phaseEnde" value="${isEdit ? phase.ende : ''}">
          </div>
        </div>
        <div class="modal-actions" style="justify-content:${isEdit ? 'space-between' : 'flex-end'};">
          ${isEdit ? `<button class="btn text" id="phaseDelete" style="color:var(--red);">Löschen</button>` : ``}
          <div style="display:flex; gap:10px;">
            <button class="btn text" id="phaseCancel">Abbrechen</button>
            <button class="btn" id="phaseSave">${isEdit ? 'Speichern' : 'Anlegen'}</button>
          </div>
        </div>
      </div>
    </div>
  `;
  document.getElementById("phaseCancel").addEventListener("click", closeModal);
  document.getElementById("modalBackdrop").addEventListener("click", (ev) => { if(ev.target.id === "modalBackdrop") closeModal(); });
  if(isEdit){
    document.getElementById("phaseDelete").addEventListener("click", () => openDeletePhaseConfirm(item, phase));
  }
  document.getElementById("phaseSave").addEventListener("click", async () => {
    const bezeichnung = document.getElementById("phaseBezeichnung").value.trim();
    const start = document.getElementById("phaseStart").value;
    const ende = document.getElementById("phaseEnde").value;
    if(!bezeichnung || !start || !ende){
      showToast("Bezeichnung, Start und Ende sind Pflichtfelder.", true);
      return;
    }
    if(ende < start){
      showToast("Das Ende darf nicht vor dem Start liegen.", true);
      return;
    }
    const saveBtn = document.getElementById("phaseSave");
    saveBtn.disabled = true;
    try{
      if(isEdit){
        await apiPatch(`/phasen/${phase.id}`, { bezeichnung, start, ende });
      } else {
        await apiPost(`/items/${item.id}/phasen`, { bezeichnung, start, ende });
      }
      await loadItems(currentTab);
      closeModal();
      renderMain();
      showToast(isEdit ? "Phase aktualisiert." : "Phase angelegt.");
    }catch(err){
      showToast("Phase konnte nicht gespeichert werden.", true);
      saveBtn.disabled = false;
    }
  });
  document.addEventListener("keydown", escCloseOnce);
}

/* ===================== New entry form ===================== */
function renderNewEntryForm(item){
  const slot = document.getElementById("newEntrySlot");
  slot.innerHTML = `
    <div class="new-entry-form">
      <div class="form-row">
        <label for="newEntryText">Kommentar / Aufgabenbeschreibung</label>
        <textarea id="newEntryText" rows="2" placeholder="Was ist zu tun oder passiert?"></textarea>
      </div>
      <div class="form-grid">
        <div class="form-row">
          <label for="newEntryUser">Verantwortlich (optional)</label>
          <select id="newEntryUser">
            <option value="">— niemand —</option>
            ${nutzer.map(n => `<option value="${n.name}">${n.name}</option>`).join("")}
          </select>
        </div>
        <div class="form-row">
          <label for="newEntryDue">Fälligkeit (optional)</label>
          <input type="date" id="newEntryDue">
        </div>
      </div>
      <div class="form-actions">
        <button class="btn text" id="cancelEntryBtn">Abbrechen</button>
        <button class="btn" id="saveEntryBtn">Eintrag speichern</button>
      </div>
    </div>
  `;
  document.getElementById("cancelEntryBtn").addEventListener("click", () => { slot.innerHTML = ""; });
  document.getElementById("saveEntryBtn").addEventListener("click", async () => {
    const text = document.getElementById("newEntryText").value.trim();
    if(!text){ document.getElementById("newEntryText").focus(); return; }
    const verantwortlich = document.getElementById("newEntryUser").value || null;
    const faelligkeit = document.getElementById("newEntryDue").value || null;
    const saveBtn = document.getElementById("saveEntryBtn");
    saveBtn.disabled = true;
    try{
      await apiPost(`/items/${item.id}/verlauf`, { text, erstelltVon: "Du", verantwortlich, faelligkeit });
      await loadItems(currentTab);
      slot.innerHTML = "";
      renderList();
      renderMain();
      updateStats();
      showToast("Eintrag gespeichert.");
    }catch(err){
      showToast("Eintrag konnte nicht gespeichert werden.", true);
      saveBtn.disabled = false;
    }
  });
}

/* ===================== Task modal ===================== */
function openTaskModal(item, entry){
  const root = document.getElementById("modalRoot");
  root.innerHTML = `
    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <h3 id="modalTitle">Aufgabe erstellen</h3>
        <div class="sub">Wird direkt in Microsoft To Do von ${entry.verantwortlich} angelegt.</div>
        <div class="form-row">
          <label for="modalAssignee">Verantwortliche Person</label>
          <select id="modalAssignee">
            ${nutzer.map(n => `<option value="${n.name}" ${n.name === entry.verantwortlich ? 'selected' : ''}>${n.name}</option>`).join("")}
          </select>
        </div>
        <div class="form-row">
          <label for="modalDue">Fälligkeitsdatum</label>
          <input type="date" id="modalDue" value="${entry.faelligkeit || ''}">
        </div>
        <div class="form-row">
          <label for="modalText">Aufgabentext</label>
          <textarea id="modalText" rows="3">${entry.text}</textarea>
        </div>
        <div class="modal-actions">
          <button class="btn text" id="modalCancel">Abbrechen</button>
          <button class="btn" id="modalConfirm">Aufgabe anlegen</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById("modalCancel").addEventListener("click", closeModal);
  document.getElementById("modalBackdrop").addEventListener("click", (ev) => { if(ev.target.id === "modalBackdrop") closeModal(); });
  document.getElementById("modalConfirm").addEventListener("click", async () => {
    const confirmBtn = document.getElementById("modalConfirm");
    confirmBtn.disabled = true;
    const verantwortlich = document.getElementById("modalAssignee").value;
    const faelligkeit = document.getElementById("modalDue").value || null;
    const text = document.getElementById("modalText").value;
    try{
      await apiPost(`/verlauf/${entry.id}/aufgabe`, { verantwortlich, faelligkeit, text });
      await loadItems(currentTab);
      closeModal();
      renderList();
      renderMain();
      updateStats();
      showToast(`Aufgabe an ${verantwortlich} übergeben.`);
    }catch(err){
      showToast("Aufgabe konnte nicht angelegt werden.", true);
      confirmBtn.disabled = false;
    }
  });
  document.addEventListener("keydown", escCloseOnce);
}
function escCloseOnce(ev){ if(ev.key === "Escape"){ closeModal(); } }
function closeModal(){
  document.getElementById("modalRoot").innerHTML = "";
  document.removeEventListener("keydown", escCloseOnce);
}

/* ===================== Löschen ===================== */
function openDeleteConfirm(item){
  const root = document.getElementById("modalRoot");
  root.innerHTML = `
    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="deleteModalTitle">
        <h3 id="deleteModalTitle">${item.kommission} löschen?</h3>
        <div class="sub">${item.kunde} wird inklusive des gesamten Verlaufs unwiderruflich gelöscht. Das kann nicht rückgängig gemacht werden.</div>
        <div class="modal-actions">
          <button class="btn text" id="deleteCancel">Abbrechen</button>
          <button class="btn" id="deleteConfirm" style="background:var(--red); border-color:var(--red);">Endgültig löschen</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById("deleteCancel").addEventListener("click", closeModal);
  document.getElementById("modalBackdrop").addEventListener("click", (ev) => { if(ev.target.id === "modalBackdrop") closeModal(); });
  document.getElementById("deleteConfirm").addEventListener("click", async () => {
    const btn = document.getElementById("deleteConfirm");
    btn.disabled = true;
    try{
      await apiDelete(`/items/${item.id}`);
      await loadItems(currentTab);
      selectedId[currentTab] = itemsCache[currentTab].length ? itemsCache[currentTab][0].id : null;
      closeModal();
      renderList();
      renderMain();
      updateStats();
      showToast("Gelöscht.");
    }catch(err){
      showToast("Konnte nicht gelöscht werden.", true);
      btn.disabled = false;
    }
  });
  document.addEventListener("keydown", escCloseOnce);
}

/* ===================== Neuer Auftrag / Neues Angebot ===================== */
function openCreateModal(kind){
  const root = document.getElementById("modalRoot");
  const isAuftrag = kind === "auftrag";
  const kindFields = isAuftrag ? `
        <div class="form-row">
          <label for="createPrio">Priorität</label>
          <select id="createPrio">
            <option value="gruen">Grün</option>
            <option value="gelb" selected>Gelb</option>
            <option value="rot">Rot</option>
          </select>
        </div>
        <div class="form-row">
          <label for="createLiefertermin">Liefertermin</label>
          <input type="date" id="createLiefertermin">
        </div>
        <div class="form-row">
          <label for="createStatus">Status</label>
          <select id="createStatus">
            <option value="offen" selected>Offen</option>
            <option value="erledigt">Erledigt</option>
          </select>
        </div>
  ` : `
        <div class="form-row">
          <label for="createStatus">Status</label>
          <select id="createStatus">
            <option value="in_bearbeitung" selected>In Bearbeitung</option>
            <option value="versendet">Versendet</option>
            <option value="wiedervorlage">Wiedervorlage</option>
            <option value="gewonnen">Gewonnen</option>
            <option value="verloren">Verloren</option>
          </select>
        </div>
        <div class="form-row">
          <label for="createWert">Angebotswert (optional)</label>
          <input type="text" id="createWert" placeholder="z.B. 42.000 €">
        </div>
        <div class="form-row">
          <label for="createWiedervorlage">Wiedervorlage (optional)</label>
          <input type="date" id="createWiedervorlage">
        </div>
  `;

  root.innerHTML = `
    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="createModalTitle">
        <h3 id="createModalTitle">${KIND_CONFIG[kind].newItemLabel.replace('+ ', '')}</h3>
        <div class="sub">Legt einen neuen ${isAuftrag ? 'Auftrag' : 'Angebotsvorgang'} in der Übersicht an.</div>
        <div class="form-row">
          <label for="createKommission">${isAuftrag ? 'Kommission' : 'Angebotsnummer'}</label>
          <input type="text" id="createKommission" placeholder="${isAuftrag ? 'z.B. K-04999/26' : 'z.B. A-05200/26'}">
        </div>
        <div class="form-row">
          <label for="createKunde">Kunde</label>
          <input type="text" id="createKunde" placeholder="Firmenname">
        </div>
        <div class="form-row">
          <label for="createLieferumfang">Lieferumfang / Beschreibung</label>
          <textarea id="createLieferumfang" rows="2"></textarea>
        </div>
        ${kindFields}
        <div class="form-row">
          <label for="createOrdner">Ordnerpfad (optional)</label>
          <input type="text" id="createOrdner" placeholder="K:\\01 HETA\\...">
        </div>
        <div class="modal-actions">
          <button class="btn text" id="createCancel">Abbrechen</button>
          <button class="btn" id="createConfirm">Anlegen</button>
        </div>
      </div>
    </div>
  `;

  document.getElementById("createCancel").addEventListener("click", closeModal);
  document.getElementById("modalBackdrop").addEventListener("click", (ev) => { if(ev.target.id === "modalBackdrop") closeModal(); });
  document.getElementById("createConfirm").addEventListener("click", async () => {
    const kommission = document.getElementById("createKommission").value.trim();
    const kunde = document.getElementById("createKunde").value.trim();
    if(!kommission || !kunde){
      showToast(isAuftrag ? "Kommission und Kunde sind Pflichtfelder." : "Angebotsnummer und Kunde sind Pflichtfelder.", true);
      return;
    }
    const confirmBtn = document.getElementById("createConfirm");
    confirmBtn.disabled = true;

    const body = {
      type: kind,
      kommission,
      kunde,
      lieferumfang: document.getElementById("createLieferumfang").value.trim(),
      ordnerPfad: document.getElementById("createOrdner").value.trim() || null,
      status: document.getElementById("createStatus").value,
    };
    if(isAuftrag){
      body.prio = document.getElementById("createPrio").value;
      body.liefertermin = document.getElementById("createLiefertermin").value || null;
    } else {
      body.wert = document.getElementById("createWert").value.trim() || null;
      body.wiedervorlage = document.getElementById("createWiedervorlage").value || null;
    }

    try{
      const created = await apiPost("/items", body);
      await loadItems(kind);
      selectedId[kind] = created.id;
      closeModal();
      renderList();
      renderMain();
      updateStats();
      showToast(isAuftrag ? "Auftrag angelegt." : "Angebot angelegt.");
    }catch(err){
      showToast("Konnte nicht angelegt werden.", true);
      confirmBtn.disabled = false;
    }
  });
  document.addEventListener("keydown", escCloseOnce);
}

/* ===================== Toast ===================== */
let toastTimer = null;
function showToast(msg, isError){
  const root = document.getElementById("toastRoot");
  root.innerHTML = `<div class="toast ${isError ? 'error' : ''}" role="status">${msg}</div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { root.innerHTML = ""; }, 2600);
}

/* ===================== Init ===================== */
async function init(){
  document.getElementById("main").innerHTML = `<div class="no-selection">Lädt…</div>`;
  try{
    await Promise.all([loadUsers(), loadItems("auftrag"), loadItems("angebot")]);
  }catch(err){
    document.getElementById("main").innerHTML = `<div class="no-selection">Daten konnten nicht geladen werden. Läuft der Server?</div>`;
    return;
  }
  renderFilterChips();
  renderNewItemButton();
  renderList();
  renderMain();
  updateStats();
}
init();
</script>
</body>
</html>
