# HTTP: leitet auf HTTPS um, sobald das Zertifikat der internen CA eingespielt ist.
server {
    listen 80;
    server_name projektbesprechung.paco.local;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name projektbesprechung.paco.local;

    # Pfade anpassen, sobald das Zertifikat von der internen CA vorliegt
    # (z.B. nach /etc/nginx/ssl/ kopieren und Rechte auf 600 setzen).
    ssl_certificate     /etc/nginx/ssl/projektbesprechung.paco.local.crt;
    ssl_certificate_key /etc/nginx/ssl/projektbesprechung.paco.local.key;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
